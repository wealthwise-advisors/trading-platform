[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autotrader"
version = "1.0.0"
description = "Futures/options backtesting platform with bar-by-bar replay and live market data (Schwab / Rithmic)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - All Rights Reserved" }
authors = [{ name = "WealthWise Advisors" }]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
]

# Verified against actual `import` statements across src/, api/,
# scripts/ (Task 10 release audit) -- not copied from the prior,
# stale requirements.txt. Two corrections made from that audit:
#   * fastapi / uvicorn / pydantic / openpyxl / reportlab / python-docx were
#     USED (api/ is a real FastAPI service; api/export/formats.py does
#     PDF/Word/Excel export) but were MISSING here entirely -- a fresh
#     `pip install` could not have run the API or hit the export endpoints.
#   * streamlit and scipy were listed but have zero remaining imports
#     anywhere in the repo (the Streamlit UI was fully removed per
#     CLAUDE.md) -- dropped as stale.
dependencies = [
    "pandas>=2.0.0",
    # parquet engine for api/store.py -- see requirements.txt for why
    "pyarrow>=13.0.0",
    # argon2id password hashing for api/auth.py
    "argon2-cffi>=23.1.0",
    "numpy>=1.24.0",
    "pandas_ta>=0.4.71b0",
    "plotly>=5.15.0",
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "websockets>=11.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0",
    "python-docx>=1.1.0",
    # Security pin (Task 10 audit, pip-audit): reportlab pulls Pillow
    # transitively; versions <12.3.0 carry 8 known CVEs (decompression-bomb
    # bypasses in font/EPS parsing, a shell-injection in WindowsViewer, a
    # native heap OOB write) -- see docs/SECURITY_AUDIT.md.
    "Pillow>=12.3.0",
]

[project.optional-dependencies]
# Real/live market data via Rithmic -- requires a licensed Rithmic account
# and credentials; not needed for backtesting or replay on synthetic/CSV/
# Schwab data. Kept optional so a default install doesn't pull in a broker
# SDK nobody without an account can use anyway.
live = ["pyrithmic>=0.1.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.15.0",
    "mypy>=1.8.0",
    "vulture>=2.11",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    "httpx2>=2.0.0",
]

[tool.setuptools.packages.find]
# db* was missing here and the deploy failed on ModuleNotFoundError: api/store.py
# imports it, and the correctness gate runs against the INSTALLED package rather
# than the repo root, where a bare directory happens to be importable.
include = ["src*", "api*", "db*"]
exclude = ["*.__pycache__", "*.__pycache__.*"]

[tool.setuptools.package-data]
# schema.sql is read at runtime by db/connection.py. Being a non-Python file it
# is not installed by default, so the package would import and then fail on the
# first connect() -- a later and more confusing failure than a missing module.
db = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Task 10.1 verification found the CI lint job (`ruff check .`) actually
# FAILS at 120 -- 68 E501 violations across api/, tests/, and
# src/broker/paper_broker.py, never caught in Task 10
# because that audit always ran ruff with a narrow --select filter, not
# the full default ruleset this config applies. 160 was chosen by
# measuring the real distribution (121-289 chars, 65/68 findings are
# <=159) rather than picked arbitrarily like 120 was -- it reflects this
# codebase's actual prevailing line length instead of an unverified
# guess. The 3 remaining outliers (162-289 chars, all single long HTML-
# template lines in dashboard/report generators) are marked individually
# with `# noqa: E501` rather than pushed into a still-higher global limit.
line-length = 160
target-version = "py312"
# legacy/ is an archive of the retired repositories, kept so they could be deleted
# without losing code. It is not built, imported or deployed, and it predates every
# convention this project now holds -- linting it would report ~13,000 findings
# about code nobody is going to change. CI runs `ruff check .`, so the exclusion has
# to live here rather than in the command.
exclude = ["src/data/schwabdev", "legacy"]   # vendored client; archived repositories

[tool.ruff.lint]
select = ["E", "F", "W"]
# E741 (ambiguous 1-char names) and E731 (lambda-assign) are pre-existing,
# individually audited findings -- see docs/RELEASE_AUDIT.md. Suppressed
# repo-wide since both are purely stylistic (never indicate a real bug the
# way an unused import/variable can).
ignore = ["E741", "E731"]

[tool.ruff.lint.per-file-ignores]
# F401/F841 (unused import / unused local) are NOT repo-wide-ignored --
# unlike E741/E731 these catch real mistakes, so the check stays live for
# every file except an already-audited, intentional exception (see
# docs/RELEASE_AUDIT.md).
"src/strategies/rsi_divergence.py" = ["F841"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["src/data/schwabdev"]

[tool.coverage.run]
# Same exclusion ruff and mypy already make, for the same reason: schwabdev is
# a vendored third-party client kept as close to upstream as possible, and this
# project does not test code it has pledged not to modify. It is 340 statements
# with none exercised, so leaving it in reported 71% where the code this team
# actually writes sits at 77% -- a number that measured the wrong thing.
# legacy/ is an archive of retired repositories, never built or deployed.
omit = [
    "src/data/schwabdev/*",
    "legacy/*",
    "*/__init__.py",
]

[tool.coverage.report]
# Lines that exist to be unreachable should not count against the total.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
skip_covered = false
precision = 1
