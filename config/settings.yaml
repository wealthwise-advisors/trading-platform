app:
  name: "AutoTrader"
  version: "1.0.0"
  log_level: "INFO"
  log_file: "logs/trading.log"

backtesting:
  initial_capital: 100000.0
  commission_per_contract: 2.50   # USD per contract round-trip
  slippage_ticks: 1               # ticks of slippage per fill

# Futures contract specs
contracts:
  ES:
    name: "E-mini S&P 500"
    exchange: "CME"
    tick_size: 0.25
    tick_value: 12.50             # USD per tick
    point_value: 50.0             # USD per full point
    margin_initial: 12000.0
    margin_maintenance: 10800.0
  NQ:
    name: "E-mini NASDAQ 100"
    exchange: "CME"
    tick_size: 0.25
    tick_value: 5.0
    point_value: 20.0
    margin_initial: 16500.0
    margin_maintenance: 15000.0
  CL:
    name: "Crude Oil"
    exchange: "NYMEX"
    tick_size: 0.01
    tick_value: 10.0
    point_value: 1000.0
    margin_initial: 6000.0
    margin_maintenance: 5500.0
  MES:
    name: "Micro E-mini S&P 500"
    exchange: "CME"
    tick_size: 0.25
    tick_value: 1.25
    point_value: 5.0
    margin_initial: 1200.0
    margin_maintenance: 1080.0
  YM:
    name: "E-mini Dow Jones"
    exchange: "CBOT"
    tick_size: 1.0
    tick_value: 5.0
    point_value: 5.0              # the Dow is quoted in index points, 1 tick = 1 point
    margin_initial: 9500.0
    margin_maintenance: 8600.0
  RTY:
    name: "E-mini Russell 2000"
    exchange: "CME"
    tick_size: 0.1
    tick_value: 5.0
    point_value: 50.0
    margin_initial: 7000.0
    margin_maintenance: 6400.0
  MNQ:
    name: "Micro E-mini NASDAQ 100"
    exchange: "CME"
    tick_size: 0.25
    tick_value: 0.5               # one tenth of NQ, which is 5.0
    point_value: 2.0
    margin_initial: 1650.0
    margin_maintenance: 1500.0
  SI:
    name: "Silver"
    exchange: "COMEX"
    tick_size: 0.005
    tick_value: 25.0              # 5,000 troy oz per contract
    point_value: 5000.0
    margin_initial: 14000.0
    margin_maintenance: 12700.0
  NG:
    name: "Natural Gas"
    exchange: "NYMEX"
    tick_size: 0.001
    tick_value: 10.0              # 10,000 MMBtu per contract
    point_value: 10000.0
    margin_initial: 4300.0
    margin_maintenance: 3900.0
  HG:
    name: "High Grade Copper"
    exchange: "COMEX"
    tick_size: 0.0005
    tick_value: 12.50
    point_value: 25000.0
    margin_initial: 4700.0
    margin_maintenance: 4300.0
  GC:
    name: "Gold"
    exchange: "COMEX"
    tick_size: 0.10
    tick_value: 10.00
    point_value: 100.0
    margin_initial: 11000.0
    margin_maintenance: 10000.0

  # Cash instruments shipped in data/sample/. Sized as ONE SHARE (or one coin),
  # not as a futures contract: "contracts per trade" therefore means shares.
  # Without these, get_contract_spec() falls back to the E-mini default and
  # values a $1 move in NVDA at $50 instead of $1.
  # US single names. Identical economics -- one share, penny tick -- so the first
  # carries the anchor and the rest merge it and override only the name. They read
  # as nine identical rows otherwise, which is no help in a list of twenty-one.
  AAPL: &equity {name: "Apple", exchange: "NASDAQ", tick_size: 0.01, tick_value: 0.01, point_value: 1.0, margin_initial: 0.0, margin_maintenance: 0.0}
  AMD:  {<<: *equity, name: "Advanced Micro Devices"}
  COIN: {<<: *equity, name: "Coinbase Global"}
  CRWV: {<<: *equity, name: "CoreWeave"}
  META: {<<: *equity, name: "Meta Platforms"}
  NVDA: {<<: *equity, name: "NVIDIA"}
  SMCI: {<<: *equity, name: "Super Micro Computer"}
  TSLA: {<<: *equity, name: "Tesla"}
  UPST: {<<: *equity, name: "Upstart Holdings"}
  BTC:
    name: "Bitcoin (spot, 1 unit)"
    exchange: "CRYPTO"
    tick_size: 0.01
    tick_value: 0.01
    point_value: 1.0
    margin_initial: 0.0
    margin_maintenance: 0.0

data:
  external_dir: "data/sample"    # Bundled 1-minute bars for 16 instruments. Point at
                                 # your own archive (e.g. "C:/Data") to use full history.

rithmic:
  gateway: "paper"               # "paper" or "live"
  server_url: ""
  username: ""
  password: ""
  system_name: "Rithmic Paper Trading"
  exchange: "CME"
