app:
  name: "AutoTrader"
  version: "1.0.0"
  log_level: "INFO"
  log_file: "logs/trading.log"

backtesting:
  initial_capital: 100000.0
  commission_per_contract: 2.50   # USD per contract round-trip
  slippage_ticks: 1               # ticks of slippage per fill

# Futures contract specs
contracts:
  ES:
    name: "E-mini S&P 500"
    exchange: "CME"
    tick_size: 0.25
    tick_value: 12.50             # USD per tick
    point_value: 50.0             # USD per full point
    margin_initial: 12000.0
    margin_maintenance: 10800.0
  NQ:
    name: "E-mini NASDAQ 100"
    exchange: "CME"
    tick_size: 0.25
    tick_value: 5.0
    point_value: 20.0
    margin_initial: 16500.0
    margin_maintenance: 15000.0
  CL:
    name: "Crude Oil"
    exchange: "NYMEX"
    tick_size: 0.01
    tick_value: 10.0
    point_value: 1000.0
    margin_initial: 6000.0
    margin_maintenance: 5500.0
  MES:
    name: "Micro E-mini S&P 500"
    exchange: "CME"
    tick_size: 0.25
    tick_value: 1.25
    point_value: 5.0
    margin_initial: 1200.0
    margin_maintenance: 1080.0
  HG:
    name: "High Grade Copper"
    exchange: "COMEX"
    tick_size: 0.0005
    tick_value: 12.50
    point_value: 25000.0
    margin_initial: 4700.0
    margin_maintenance: 4300.0
  GC:
    name: "Gold"
    exchange: "COMEX"
    tick_size: 0.10
    tick_value: 10.00
    point_value: 100.0
    margin_initial: 11000.0
    margin_maintenance: 10000.0

  # Cash instruments shipped in data/sample/. Sized as ONE SHARE (or one coin),
  # not as a futures contract: "contracts per trade" therefore means shares.
  # Without these, get_contract_spec() falls back to the E-mini default and
  # values a $1 move in NVDA at $50 instead of $1.
  AAPL: &equity {name: "Equity (1 share)", exchange: "NASDAQ", tick_size: 0.01, tick_value: 0.01, point_value: 1.0, margin_initial: 0.0, margin_maintenance: 0.0}
  AMD:  *equity
  COIN: *equity
  CRWV: *equity
  META: *equity
  NVDA: *equity
  SMCI: *equity
  TSLA: *equity
  UPST: *equity
  BTC:
    name: "Bitcoin (spot, 1 unit)"
    exchange: "CRYPTO"
    tick_size: 0.01
    tick_value: 0.01
    point_value: 1.0
    margin_initial: 0.0
    margin_maintenance: 0.0

data:
  external_dir: "data/sample"    # Bundled 1-minute bars for 16 instruments. Point at
                                 # your own archive (e.g. "C:/Data") to use full history.

rithmic:
  gateway: "paper"               # "paper" or "live"
  server_url: ""
  username: ""
  password: ""
  system_name: "Rithmic Paper Trading"
  exchange: "CME"
