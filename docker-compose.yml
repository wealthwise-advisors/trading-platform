# AutoTrader -- production deployment (Task 10, v1.0.0).
#
#   docker compose up --build
#
# Frontend (web, port 8080) reverse-proxies /api/* to the api service, so
# the browser only ever talks to one origin -- see web/nginx.conf. The api
# service is not published to the host by default (only reachable from the
# web container's proxy and other compose services); uncomment its `ports:`
# below if you need to hit it directly (e.g. from Postman) during a
# deployment smoke test.
#
# config/ is mounted read-only: credentials.yaml (gitignored, never built
# into the image) must exist on the host before startup if you need Schwab
# or Rithmic. Without it, the API still runs -- synthetic data, backtesting,
# and replay all work with zero external credentials; see
# docs/CONFIGURATION.md.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: autotrader-api:1.0.0
    restart: unless-stopped
    environment:
      AUTOTRADER_CORS_ORIGINS: "${AUTOTRADER_CORS_ORIGINS:-http://localhost:8080}"
      # Surfaced by /api/version so a deploy can prove the container answering
      # is the one it just built. "unknown" locally; the deploy workflow sets
      # it to the commit being shipped.
      AUTOTRADER_COMMIT: "${AUTOTRADER_COMMIT:-unknown}"

      # ── OAuth sign-in (Google / LinkedIn / Twitter) ────────────────────────
      # Every one of these defaults to empty, and empty means the provider is
      # reported as unconfigured and its button explains itself. Nothing here
      # is a secret in the repo: the values come from GitHub repo secrets via
      # the inline env prefix in .github/workflows/deploy.yml.
      #
      # The base URL is the public origin a browser reaches this deployment on.
      # It cannot be derived from the request -- Host is client-supplied -- and
      # it has to match the redirect URI registered at each provider byte for
      # byte, so it is stated rather than guessed.
      #
      # Apple is deliberately absent: "Sign in with Apple" needs a paid Apple
      # Developer Program membership and an ES256-signed JWT in place of a
      # client secret. api/oauth.py has no Apple provider, so its button keeps
      # showing the honest "not connected yet" notice until that account exists.
      AUTOTRADER_PUBLIC_BASE_URL: "${AUTOTRADER_PUBLIC_BASE_URL:-}"

      # Email verification and password reset (Resend), and the CAPTCHA.
      # Empty is a supported state: the application reports each as dormant
      # and the features that depend on them stay shut, rather than the
      # container refusing to start. See api/verification.py and api/captcha.py.
      AUTOTRADER_RESEND_API_KEY: "${AUTOTRADER_RESEND_API_KEY:-}"
      AUTOTRADER_MAIL_FROM: "${AUTOTRADER_MAIL_FROM:-}"
      AUTOTRADER_TURNSTILE_SITE_KEY: "${AUTOTRADER_TURNSTILE_SITE_KEY:-}"
      AUTOTRADER_TURNSTILE_SECRET_KEY: "${AUTOTRADER_TURNSTILE_SECRET_KEY:-}"
      AUTOTRADER_GOOGLE_CLIENT_ID: "${AUTOTRADER_GOOGLE_CLIENT_ID:-}"
      AUTOTRADER_GOOGLE_CLIENT_SECRET: "${AUTOTRADER_GOOGLE_CLIENT_SECRET:-}"
      AUTOTRADER_LINKEDIN_CLIENT_ID: "${AUTOTRADER_LINKEDIN_CLIENT_ID:-}"
      AUTOTRADER_LINKEDIN_CLIENT_SECRET: "${AUTOTRADER_LINKEDIN_CLIENT_SECRET:-}"
      AUTOTRADER_TWITTER_CLIENT_ID: "${AUTOTRADER_TWITTER_CLIENT_ID:-}"
      AUTOTRADER_TWITTER_CLIENT_SECRET: "${AUTOTRADER_TWITTER_CLIENT_SECRET:-}"
    volumes:
      # NOT read-only. The Schwab client persists refreshed OAuth tokens back
      # to config/schwab_tokens.json (see src/data/schwab_provider.py), so a
      # :ro mount lets the app authenticate once and then fail silently the
      # first time the token refreshes. Both credentials.yaml and
      # schwab_tokens.json are gitignored, so `git clean -fd` during a deploy
      # leaves them alone and they survive redeploys.
      - ./config:/app/config
      - autotrader-data:/app/data
      - autotrader-logs:/app/logs
    # ports:
    #   - "8000:8000"   # uncomment to reach the API directly on the host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: web
      dockerfile: Dockerfile
    image: autotrader-web:1.0.0
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # The hostname the certificate is for. sslip.io resolves any
      # a-b-c-d.sslip.io to a.b.c.d with no DNS records to manage, which is
      # what makes TLS possible here at all: a certificate authority cannot
      # issue for a bare IP address, so http:// was the only option and every
      # visitor paid a failed HTTPS probe before the page could start loading.
      TLS_DOMAIN: "${TLS_DOMAIN:-}"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    ports:
      # Configurable rather than fixed, and deliberately NOT split across a
      # second compose file: compose CONCATENATES `ports` when merging files,
      # so an overlay would publish 8080 and 80 both. One variable keeps the
      # difference in one place and works on every compose version.
      #
      # 8080 by default because ports below 1024 need privileges on a laptop.
      # The deploy sets WEB_PORT=80. That difference previously lived in an
      # untracked docker-compose.override.yml on the box; when the app moved
      # up one directory the override was stranded, the deploy published 8080,
      # and the previous stack kept port 80 and kept answering every check.
      - "${WEB_PORT:-8080}:80"
      - "${TLS_PORT:-8443}:443"

  # Obtains and renews the TLS certificate.
  #
  # Runs as a loop rather than a one-shot because the certificate has to be
  # requested AFTER nginx is answering on port 80 -- that is how control of the
  # hostname is proven -- and because a 90-day certificate needs renewing.
  #
  # It writes into a volume the web container mounts read-only; the watcher in
  # that container notices the files appear and reloads. Nothing here can stop
  # the site serving: if certbot never succeeds, the volume stays empty, the
  # TLS server is never installed, and port 80 carries on exactly as before.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    depends_on:
      - web
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    environment:
      TLS_DOMAIN: "${TLS_DOMAIN:-}"
    # ONE COMMAND PER LINE, ALL AT THE SAME INDENT -- this matters.
    #
    # A YAML folded scalar only folds newlines into spaces for lines at the
    # BASE indent. Indent a continuation further, as a shell script naturally
    # wants, and YAML preserves the newline instead. The first cut wrapped the
    # certbot invocation that way, so the newline after "-w /var/www/certbot"
    # terminated the command and certbot ran with no -d domain at all, then the
    # orphaned "-d ..." line failed as an unknown command. It is syntactically
    # valid shell, so `sh -n` passes it happily; it just does the wrong thing.
    entrypoint: >
      sh -c 'if [ -z "$${TLS_DOMAIN}" ]; then echo "certbot: TLS_DOMAIN unset, nothing to do"; sleep infinity; fi;
      echo "certbot: requesting a certificate for $${TLS_DOMAIN}";
      while :; do certbot certonly --webroot -w /var/www/certbot -d "$${TLS_DOMAIN}" --non-interactive --agree-tos --register-unsafely-without-email --keep-until-expiring || echo "certbot: attempt failed, will retry";
      sleep 12h; done'

# Volume names are pinned explicitly.
#
# Without a `name:`, compose prefixes each volume with the project name, which
# it derives from the working directory. The repository migration moved the app
# from /opt/wealthwise/repo/trading-platform up to /opt/wealthwise/repo, so the
# project silently changed from "trading-platform" to "repo" and the deploy
# mounted a brand-new, empty pair of volumes -- the live data was still on disk
# but no longer attached to anything.
#
# The names below are the ones that actually hold the production data. They
# read oddly in this repository, and that is the point: renaming them would
# orphan the data again. A cosmetic rename is a deliberate migration for
# another day, not a side effect of a directory move.
volumes:
  autotrader-data:
    name: trading-platform_autotrader-data
  autotrader-logs:
    name: trading-platform_autotrader-logs
  # The certificate and its ACME account key. Named, like the two above, so a
  # change of compose project name cannot orphan them -- losing these would
  # mean re-issuing and burning Let's Encrypt rate limit for no reason.
  letsencrypt:
    name: trading-platform_letsencrypt
  certbot-webroot:
    name: trading-platform_certbot_webroot
