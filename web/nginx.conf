# Serves the built React SPA and reverse-proxies /api/* to the FastAPI
# service (Docker service name "api", see docker-compose.yml) so the
# browser sees ONE origin -- no CORS needed in this default deployment
# topology. (api/main.py still ships a CORS policy for anyone deploying
# the API standalone, e.g. `npm run dev` against a local uvicorn.)

# Live Replay drives playback over a WebSocket (/api/replay/ws/{id}). nginx
# proxies with HTTP/1.0 by default and strips hop-by-hop headers, so without
# the three directives below the upgrade never reaches FastAPI: the request
# arrives as a plain GET, the websocket route does not match it, and the
# browser gets 404 instead of 101. Playback silently never starts.
#
# $connection_upgrade is "upgrade" for a websocket request and "close"
# otherwise, so ordinary REST calls on the same /api/ prefix are unaffected.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # COMPRESSION -- this is the difference between the app loading and not.
    #
    # nginx shipped every byte of the bundle raw. Measured from outside on
    # 2026-08-20: 5,189,781 bytes with no Content-Encoding, over a link running
    # at ~69 KB/s, so the browser spent ~75 seconds on one script tag. A network
    # trace showed the JS requested and still unanswered after 14s while the CSS
    # had long since arrived; #root had zero children and the page was blank.
    # React was never given the chance to mount.
    #
    # The same bundle gzips to 1,535,659 bytes -- 3.4x -- which is ~22s on that
    # link and about a second on a normal one.
    gzip on;
    gzip_vary on;            # keep compressed and plain copies apart in caches
    gzip_comp_level 6;       # the knee: 9 costs roughly double the CPU for ~1%
    gzip_min_length 256;     # below this the gzip header costs more than it saves
    gzip_proxied any;        # compress for proxied clients too, not just direct

    # BOTH javascript types are listed on purpose. nginx changed the mime.types
    # mapping for .js from application/javascript to text/javascript in 1.21.
    # Listing only one means that on half the nginx versions in existence this
    # whole block silently does nothing to the file that matters most.
    #
    # text/html is compressed whenever gzip is on and must NOT be listed -- nginx
    # warns about the duplicate.
    gzip_types
        application/javascript
        text/javascript
        text/css
        text/plain
        text/xml
        application/json
        application/xml
        image/svg+xml;
    # woff2 is deliberately absent: it is already compressed, and gzipping it
    # again costs CPU to make the file marginally bigger.

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A paused replay holds an idle socket; 120s would drop it mid-session.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # CACHING -- the two rules below are not an optimisation, they are what
    # makes a deploy visible.
    #
    # Vite fingerprints every asset (index-5_sINtK0.js), so a new build always
    # produces new filenames. index.html is the only file that names them, and
    # it keeps the SAME url across builds. Serving it without an explicit
    # Cache-Control let browsers fall back to HEURISTIC caching -- they reused
    # a stored index.html, which still pointed at the PREVIOUS build's bundle,
    # so a user saw the old app indefinitely while the new one sat unreferenced
    # on disk. That is exactly what happened after the multi-timeframe deploy:
    # the new bundle was being served correctly and nobody could reach it.
    #
    # index.html therefore must always be revalidated; the fingerprinted assets
    # it points at can be cached forever, because their names change when their
    # contents do.

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        # no-cache (not no-store): the browser may keep a copy but must check
        # with us before using it. With the ETag above that is a cheap 304.
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
