# Serves the built React SPA and reverse-proxies /api/* to the FastAPI
# service (Docker service name "api", see docker-compose.yml) so the
# browser sees ONE origin -- no CORS needed in this default deployment
# topology. (api/main.py still ships a CORS policy for anyone deploying
# the API standalone, e.g. `npm run dev` against a local uvicorn.)

# Live Replay drives playback over a WebSocket (/api/replay/ws/{id}). nginx
# proxies with HTTP/1.0 by default and strips hop-by-hop headers, so without
# the three directives below the upgrade never reaches FastAPI: the request
# arrives as a plain GET, the websocket route does not match it, and the
# browser gets 404 instead of 101. Playback silently never starts.
#
# $connection_upgrade is "upgrade" for a websocket request and "close"
# otherwise, so ordinary REST calls on the same /api/ prefix are unaffected.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A paused replay holds an idle socket; 120s would drop it mid-session.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # CACHING -- the two rules below are not an optimisation, they are what
    # makes a deploy visible.
    #
    # Vite fingerprints every asset (index-5_sINtK0.js), so a new build always
    # produces new filenames. index.html is the only file that names them, and
    # it keeps the SAME url across builds. Serving it without an explicit
    # Cache-Control let browsers fall back to HEURISTIC caching -- they reused
    # a stored index.html, which still pointed at the PREVIOUS build's bundle,
    # so a user saw the old app indefinitely while the new one sat unreferenced
    # on disk. That is exactly what happened after the multi-timeframe deploy:
    # the new bundle was being served correctly and nobody could reach it.
    #
    # index.html therefore must always be revalidated; the fingerprinted assets
    # it points at can be cached forever, because their names change when their
    # contents do.

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        # no-cache (not no-store): the browser may keep a copy but must check
        # with us before using it. With the ETag above that is a cheap 304.
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
