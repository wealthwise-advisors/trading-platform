*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); overflow:hidden;
  font-family:'Geist Variable',ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* ── scene ─────────────────────────────────────────────────────────────── */
.scene{position:fixed;inset:0;overflow:hidden}
.scene .photo{position:absolute;inset:0;background-image:var(--shot);
  background-size:cover;background-position:center;}
/* dusk sky */
.sky{position:absolute;inset:0;
  background:
    radial-gradient(120% 80% at 22% 8%, rgba(139,102,186,.52), transparent 60%),
    radial-gradient(100% 70% at 78% 4%, rgba(214,132,96,.40), transparent 55%),
    linear-gradient(180deg,#243050 0%,#1d2540 34%,#141c2e 66%,#0d131f 100%);}
/* skyline, two depths. Selector is .scene > svg -- the svg is a SIBLING
   of .sky, not a child of it, which is why .sky svg matched nothing. */
.scene > svg{position:absolute;bottom:0;left:0;width:100%;height:58%}
.far  rect{fill:#1a2334}
.near rect{fill:#111a2a}
.win{fill:#f0c98a}
.win.c{fill:#8fd0ff}
@keyframes flick{0%,92%,100%{opacity:var(--o)}95%{opacity:calc(var(--o)*.25)}}
/* window glass + reflection */
.glass{position:absolute;inset:0;
  background:linear-gradient(102deg,transparent 0 58%,rgba(255,255,255,.028) 58% 60%,transparent 60%),
             linear-gradient(180deg,rgba(255,255,255,.03),transparent 30%);}
.mullion{position:absolute;top:0;bottom:0;width:2px;background:rgba(6,10,16,.55)}
/* desk + monitor glow across the lower left */
.desk{position:absolute;left:0;right:0;bottom:0;height:26%;
  background:linear-gradient(180deg,transparent,rgba(7,11,17,.55) 46%,rgba(7,10,16,.94));}
.glow{position:absolute;left:6%;bottom:8%;width:46%;height:34%;
  background:radial-gradient(ellipse at 50% 60%,rgba(16,185,129,.16),transparent 62%);
  filter:blur(8px);animation:pulse 7s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 200px 30px rgba(4,7,12,.62)}

/* ── layout ────────────────────────────────────────────────────────────── */
.wrap{position:relative;height:100%;display:grid;
  grid-template-columns:1fr 520px;align-items:center;gap:40px;
  padding:0 clamp(28px,5vw,86px)}

/* left */
.brandline{max-width:520px;animation:fade .9s cubic-bezier(.16,1,.3,1) both}
.brandline h1{font-size:clamp(38px,4.4vw,60px);line-height:1.06;font-weight:700;
  letter-spacing:-.025em}
.brandline h1 em{font-style:normal;color:var(--em2)}
.brandline hr{width:64px;height:3px;border:0;border-radius:2px;margin:26px 0 20px;
  background:linear-gradient(90deg,var(--em),transparent)}
.brandline p{font-size:17px;line-height:1.6;color:var(--dim);max-width:330px}
@keyframes fade{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* right: the card */
.card{
  position:relative;padding:30px 34px 24px;border-radius:var(--r);
  background:var(--panel);border:1px solid var(--line);
  backdrop-filter:blur(22px) saturate(1.25);-webkit-backdrop-filter:blur(22px) saturate(1.25);
  box-shadow:0 40px 90px -28px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.03) inset;
  animation:fade .9s .12s cubic-bezier(.16,1,.3,1) both;
}
.card::before{content:'';position:absolute;inset:0 0 auto;height:1px;
  border-radius:var(--r) var(--r) 0 0;
  background:linear-gradient(90deg,transparent,var(--em),transparent);
  background-size:220% 100%;animation:sweep 7s ease-in-out infinite}
@keyframes sweep{0%,100%{background-position:0 0}50%{background-position:100% 0}}

.logo{display:flex;align-items:center;justify-content:center;gap:13px;margin-bottom:20px}
.logo img.m{width:38px;height:38px;border-radius:9px;object-fit:cover;
  box-shadow:0 0 0 1px rgba(255,255,255,.10),0 8px 20px -8px rgba(0,0,0,.8)}
.logo img.w{height:23px;width:auto;object-fit:contain}

.hello{text-align:center;margin-bottom:22px}
.hello h2{font-size:27px;font-weight:700;letter-spacing:-.02em}
.hello h2 .nm{color:var(--em2)}
.hello p{margin-top:6px;font-size:13.5px;color:var(--dim)}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:20px;
  border-bottom:1px solid var(--line)}
.tabs button{background:0;border:0;font:inherit;font-size:14.5px;color:var(--dim);
  padding:11px 0 12px;cursor:pointer;position:relative;transition:color .2s}
.tabs button.on{color:var(--em2);font-weight:600}
.tabs button.on::after{content:'';position:absolute;left:12%;right:12%;bottom:-1px;height:2px;
  background:var(--em);border-radius:2px;animation:grow .35s cubic-bezier(.16,1,.3,1)}
@keyframes grow{from{transform:scaleX(.2);opacity:0}to{transform:none;opacity:1}}
.tabs button:hover{color:var(--ink)}

.f{position:relative;margin-bottom:13px}
.f .ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;color:#7f8ca3;pointer-events:none;transition:color .2s}
.f input{width:100%;height:52px;padding:0 46px 0 46px;font:inherit;font-size:14.5px;
  color:var(--ink);background:rgba(255,255,255,.045);border:1px solid var(--line);
  border-radius:11px;outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
.f input::placeholder{color:#6d7893}
.f input:focus{border-color:var(--em);background:rgba(16,185,129,.06);
  box-shadow:0 0 0 3px rgba(16,185,129,.16)}
.f input:focus~.ic{color:var(--em2)}
.eye{position:absolute;right:13px;top:50%;transform:translateY(-50%);
  background:0;border:0;padding:6px;cursor:pointer;color:#7f8ca3;line-height:0;
  border-radius:7px;transition:color .2s,background .2s}
.eye:hover{color:var(--ink);background:rgba(255,255,255,.06)}

.row{display:flex;align-items:center;justify-content:space-between;margin:14px 0 18px;
  font-size:13px}
.chk{display:flex;align-items:center;gap:9px;color:var(--dim);cursor:pointer;user-select:none}
.chk input{position:absolute;opacity:0;pointer-events:none}
.box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);
  display:grid;place-items:center;transition:all .18s}
.chk input:checked+.box{background:var(--em);border-color:var(--em)}
.box svg{width:11px;height:11px;opacity:0;transform:scale(.6);transition:all .18s}
.chk input:checked+.box svg{opacity:1;transform:none}
.row a{color:var(--em2);text-decoration:none}
.row a:hover{text-decoration:underline}

.go{width:100%;height:52px;border:0;border-radius:12px;cursor:pointer;font:inherit;
  font-size:15.5px;font-weight:650;color:#04140d;letter-spacing:.01em;
  background:linear-gradient(135deg,var(--em2),var(--em) 46%,var(--em-deep));
  display:flex;align-items:center;justify-content:center;gap:10px;
  position:relative;overflow:hidden;
  box-shadow:0 12px 30px -10px rgba(16,185,129,.55);
  transition:transform .16s,box-shadow .2s,filter .16s}
.go:hover{filter:brightness(1.06);box-shadow:0 16px 38px -10px rgba(16,185,129,.7)}
.go:active{transform:translateY(1px)}
.go svg{width:17px;height:17px;transition:transform .2s}
.go:hover svg{transform:translateX(3px)}
.go::after{content:'';position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent)}
.go:hover::after{animation:pass .8s ease}
@keyframes pass{to{transform:translateX(100%)}}

.or{display:flex;align-items:center;gap:14px;margin:20px 0 15px;
  font-size:12.5px;color:var(--dim)}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}

.soc{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.soc button{height:48px;border-radius:11px;border:1px solid var(--line);cursor:pointer;
  background:rgba(255,255,255,.04);color:var(--ink);font:inherit;font-size:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  transition:background .18s,border-color .18s,transform .18s}
.soc button:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);
  transform:translateY(-2px)}
.soc svg{width:17px;height:17px}
  .soc button.soc-off{opacity:.45}

.legal{display:flex;align-items:center;justify-content:center;gap:12px;
  margin-top:20px;padding-top:15px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--dim)}
.legal a{color:var(--dim);text-decoration:none}
.legal a:hover{color:var(--ink)}
.legal i{font-style:normal;opacity:.35}

.copy{position:fixed;left:clamp(28px,5vw,86px);bottom:26px;
  font-size:11.5px;color:#6b7690;z-index:2}

@media (max-width:980px){
  .wrap{grid-template-columns:1fr;justify-items:center}
  .brandline{display:none}
  .copy{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ── responsive ───────────────────────────────────────────────────────────
   The page used to be overflow:hidden with a fixed 520px card. On a laptop
   the sign-up card is taller than the viewport, so its button and footer were
   simply cut off with no way to reach them. The page scrolls now, and the
   card is fluid rather than fixed.                                          */
html,body{min-height:100%;height:auto}
body{overflow-x:hidden;overflow-y:auto}
.scene{position:fixed}
.wrap{min-height:100vh;height:auto;padding-top:40px;padding-bottom:40px;
      align-items:center}
.card,.card.wide{width:100%;max-width:520px;justify-self:end}

@media (max-width:1120px){
  .wrap{grid-template-columns:1fr 460px;gap:28px}
}
@media (max-width:980px){
  .wrap{grid-template-columns:minmax(0,1fr);justify-items:center;
        padding-left:20px;padding-right:20px}
  .brandline{display:none}
  .copy{display:none}
  .card,.card.wide{justify-self:center;max-width:520px}
}
@media (max-width:560px){
  .card,.card.wide{padding:24px 18px 20px;border-radius:14px}
  .two{grid-template-columns:1fr;gap:0}          /* stacked, never squeezed */
  .soc{grid-template-columns:repeat(2,1fr)}      /* 4 across is too tight    */
  .hello h2{font-size:23px}
  .logo img.w{height:20px}
  .pop ul{max-height:200px}
}
/* a dropdown must never be the thing that makes the page scroll sideways */
.combo{min-width:0}
.pop{max-width:100vw}


/* auth messages -- reuses the card's own tokens, adds no new palette */
.msg{margin:12px 0 0;padding:10px 13px;border-radius:9px;font-size:13px;
  line-height:1.5;display:none}
.msg.show{display:block;animation:fade .28s ease both}
.msg.err{background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.35);
  color:#fca5a5}
.msg.info{background:rgba(16,185,129,.10);border:1px solid rgba(16,185,129,.32);
  color:var(--em2)}
.go[aria-busy="true"]{opacity:.72;pointer-events:none}
.go[disabled]{opacity:.5;pointer-events:none;filter:grayscale(.35)}


/* With a real photo loaded, hide the drawn stand-in underneath so the two do
   not blend into each other. */
.scene:has(.photo[data-loaded]) .sky,
.scene:has(.photo[data-loaded]) > svg { opacity:0 }
.photo{ z-index:1 }
.glass,.mullion{ z-index:2 }
.desk,.glow,.vig{ z-index:3 }

.fl{
  font-family:'Twemoji Country Flags','Segoe UI Emoji','Apple Color Emoji',
              'Noto Color Emoji',sans-serif;
  font-size:18px;line-height:1;
}


/* The country list drops the dial code: this control answers "where do you
   live", and a code there reads as a second phone prefix. The phone list keeps
   it, because that is what the code is for. */
#cCountry .pop .cd{ display:none }

/* Headline, stacked as in the design. Four lines, tighter leading, and the
   block sits higher rather than centred against the card. */
.brandline{ align-self:start; margin-top:12vh }
.brandline h1{
  font-size:clamp(40px,5.2vw,68px); line-height:1.02; letter-spacing:-.03em;
  font-weight:700;
}
.brandline hr{ width:56px; margin:22px 0 18px }

/* The supporting line as the design draws it: monospace, quoted, indented. */
.brandline p{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:15px; line-height:1.75; color:#b9c6da; max-width:380px;
  position:relative; padding-left:20px;
}
.brandline p::before{
  content:'\201C'; position:absolute; left:0; top:-6px;
  font-family:Georgia,serif; font-size:34px; color:var(--em2); opacity:.85;
}
.brandline p::after{
  content:'\201D'; font-family:Georgia,serif; font-size:34px; color:var(--em2);
  opacity:.85; line-height:0; position:relative; top:12px; margin-left:3px;
}
@media (max-width:980px){ .brandline{ margin-top:0 } }


/* ── legibility over the photograph ──────────────────────────────────────
   The supporting line lands on the brightest part of the picture -- the
   monitor and the candles -- where a pale blue-grey simply disappears. Two
   things fix it, and it needs both:

   1. A scrim. No single colour survives a photograph that is dark sky at the
      top and lit screen at the bottom, so the text gets its own soft pool of
      shade to sit on. It is a wide, feathered radial so there is no visible
      edge -- the photo still reads, the words stop fighting it.
   2. A warmer ink. White competes with the headline and the screen glare, and
      green competes with the candles; amber sits against both, and picks up
      the city lights and the bronze bull already in the frame.
------------------------------------------------------------------------- */
.brandline{ position:relative; z-index:1 }
.brandline::before{
  content:''; position:absolute; z-index:-1; pointer-events:none;
  inset:-56px -80px -48px -64px;
  background:radial-gradient(115% 88% at 22% 46%,
    rgba(2,8,15,.86) 0%, rgba(2,8,15,.70) 38%,
    rgba(2,8,15,.34) 62%, rgba(2,8,15,0) 80%);
}
.brandline h1{ text-shadow:0 2px 26px rgba(0,0,0,.5) }
.brandline p{
  color:#f2c98a;
  text-shadow:0 1px 10px rgba(0,0,0,.7), 0 0 2px rgba(0,0,0,.5);
}
/* The quote marks follow the line they belong to. */
.brandline p::before, .brandline p::after{ color:#f2c98a; opacity:.7 }
/* The rule above the line was the same grey; lift it to match. */
.brandline hr{ border:0; height:2px; background:var(--em2); opacity:.9 }


/* A provider that simply is not connected yet is neither a failure nor a
   success -- red reads as "something broke", green as "that worked". This is
   neither, so it gets a neutral tone, and it sits directly under the buttons
   it is talking about rather than up beside the submit button. */
.socmsg{ margin:11px 0 0; text-align:center }
.msg.note{
  background:rgba(255,255,255,.05); border:1px solid var(--line); color:#c3d0e2;
}


/* Three providers, not four. Apple is deliberately absent -- it needs a paid
   Apple Developer membership and an ES256-signed JWT from a .p8 key rather
   than a client secret, so there is no backend for it and a fourth button
   could not have been made to work. */
.soc{ grid-template-columns:repeat(4,1fr) }


/* Forgot-password / set-new-password modes. */
body.recovery .hide-in-recovery{ display:none !important }
.backlink{
  display:block; margin:15px 0 0; text-align:center; font-size:13px;
  color:#8c9ab2; text-decoration:none;
}
.backlink:hover{ color:var(--em2) }


/* The recovery CAPTCHA. Hidden until recovery mode asks for it, and collapsed
   entirely when Turnstile is not configured -- an empty bordered box reads as
   something that failed to load. */
.cap{ margin:13px 0 0; display:none }
.cap.on{ display:block; min-height:65px }
.cap .why{ margin:7px 2px 0; font-size:12px; color:#7f8ca3 }


/* "Forgot password?" -- reported as missing, because at 13px in the far corner
   of a photographic background it read as fine print rather than the way out
   of being locked out. It is the only route back into an account for someone
   who cannot sign in, so it gets the weight of a control: larger, underlined
   so it is legibly a link, and with a hit area big enough for a thumb. */
.row a{
  font-size:14px; font-weight:600; text-decoration:underline;
  text-underline-offset:3px; padding:6px 2px; border-radius:6px;
}
.row a:hover{ color:var(--ink); text-decoration-thickness:2px }
.row a:focus-visible{ outline:2px solid var(--em2); outline-offset:2px }


/* Two recovery links now, because sign-in is by USERNAME -- forgetting that
   locks someone out exactly as completely as forgetting the password, and
   password reset never tells them what it is. */
.row .sep{ margin:0 7px; color:#5c6a80 }
@media (max-width:420px){
  .row{ flex-wrap:wrap; row-gap:6px }
  .row .sep{ display:none }
  .row a{ display:inline-block }
}

</style>

<script>
  /* "Welcome back, Akash".
     The name comes from the LAST successful sign-in, remembered on this
     device, so the greeting is a real one rather than an echo of whatever is
     being typed. Only a display name is stored -- never the session, which
     lives in an HttpOnly cookie this page cannot read, and never a password. */
  var u = document.getElementById('u'), nm = document.getElementById('nm');
  var REMEMBERED = 'autotrader_display_name';

  function greet(name){
    nm.textContent = name ? ', ' + name : '';
  }
  function firstName(full, fallback){
    var n = (full || '').trim().split(/\s+/)[0] || (fallback || '').trim();
    return n ? n.charAt(0).toUpperCase() + n.slice(1) : '';
  }
  try { greet(localStorage.getItem(REMEMBERED) || ''); } catch (e) { /* private mode */ }

  /* Typing a different username clears a stale greeting rather than greeting
     one person while another signs in. */
  u.addEventListener('input', function(){
    try {
      var saved = localStorage.getItem(REMEMBERED) || '';
      var typed = u.value.trim();
      if (!typed) { greet(saved); return; }
      greet(typed.toLowerCase().indexOf(saved.toLowerCase()) === 0 ? saved : '');
    } catch (e) { /* ignore */ }
  });

  window.__rememberName = function(me){
    try {
      var n = firstName(me && me.full_name, me && me.username);
      if (n) localStorage.setItem(REMEMBERED, n);
    } catch (e) { /* ignore */ }
  };
  /* password visibility */
  var p = document.getElementById('p'), eye = document.getElementById('eye');
  eye.addEventListener('click', function(){
    var show = p.type === 'password';
    p.type = show ? 'text' : 'password';
    eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });
  /* tabs */
  /* The two tabs are two DOCUMENTS, not two panels: clicking the inactive
     one has to navigate. Previously it only moved the .on class, so the page
     never changed and the tabs looked broken. The already-active tab does
     nothing rather than reloading the page under the user. */
  document.querySelectorAll('.tabs button').forEach(function(b){
    b.addEventListener('click', function(){
      if (b.classList.contains('on')) return;
      var label = (b.textContent || '').trim().toLowerCase();
      window.location.assign(
        label.indexOf('create') === 0 ? 'autotrader_signup.html'
                                      : 'autotrader_signin.html');
    });
  });
</script>
<script>
/* ---------------------------------------------------------------------------
   Sign-in, wired to the existing backend. No second auth system: this posts to
   /api/auth/login and lets the server set its HttpOnly cookie. The token is
   never read, stored or touched by this page -- that is the point of HttpOnly.
--------------------------------------------------------------------------- */
(function () {
  var form = document.querySelector("form.card");
  if (!form) return;
  var btn = form.querySelector(".go");
  var u = document.getElementById("u");
  var p = document.getElementById("p");

  var msg = document.createElement("div");
  msg.className = "msg";
  msg.setAttribute("role", "status");
  btn.insertAdjacentElement("afterend", msg);

  function say(text, kind) {
    msg.textContent = text;
    msg.className = "msg show " + (kind || "err");
  }
  function clear() { msg.className = "msg"; }

  /* Why the visitor was sent here, if they were bounced. */
  var q = new URLSearchParams(window.location.search);
  var reason = q.get("reason");
  if (reason === "expired") say("Your session has expired. Please sign in again.", "err");
  else if (reason === "required") say("Please sign in to continue.", "info");
  else if (reason === "loggedout") say("You have been signed out.", "info");

  /* Reasons an OAuth attempt can send somebody back here. Each says what
     happened without saying whether an account exists -- "no account" and
     "wrong account" are deliberately one message. */
  /* The providers' own spellings. Capitalising the url slug would print
     "Linkedin", which is not how they write it. */
  var OAUTH_LABELS = { google:"Google", linkedin:"LinkedIn", twitter:"Twitter",
                       apple:"Apple" };
  var oauthProvider = (q.get("provider") || "").toLowerCase();
  var oauthName = OAUTH_LABELS[oauthProvider] || "That provider";
  if (reason === "oauth_unconfigured")
    say(oauthName + " sign-in is not connected yet. Use your username and password.", "err");
  else if (reason === "oauth_no_account")
    say("That " + oauthName + " account is not linked to an account here. " +
        "Ask an administrator to set it up.", "err");
  else if (reason === "oauth_expired")
    say("That sign-in attempt expired. Please try again.", "err");
  else if (reason === "oauth_cancelled")
    say("Sign-in with " + oauthName + " was cancelled.", "info");
  else if (reason === "oauth_throttled")
    say("Too many attempts. Please wait a moment and try again.", "err");
  else if (reason === "oauth_failed")
    say("Could not complete sign-in with " + oauthName + ". Please try again.", "err");


  /* Where to go afterwards. Only a same-site path is accepted -- taking the
     value as given would let a crafted link bounce someone to another host
     straight after they authenticate. */
  function destination() {
    var next = q.get("next") || "/";
    if (next.charAt(0) !== "/" || next.charAt(1) === "/") return "/";
    if (next.indexOf("autotrader_signin") !== -1) return "/";
    return next;
  }

  async function submit() {
    var username = (u.value || "").trim();
    var password = p.value || "";
    if (!username || !password) {
      say("Enter your username and password.");
      (username ? p : u).focus();
      return;
    }
    clear();
    btn.setAttribute("aria-busy", "true");
    var original = btn.firstChild.nodeValue;
    btn.firstChild.nodeValue = "Signing in… ";
    try {
      var res = await fetch("/api/auth/login", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: username, password: password,
          /* Unticked means a cookie that dies with the browser, which is
             what this box has always appeared to promise and never did. */
          remember: !!(document.querySelector(".row input[type=checkbox]")
                       || {}).checked }),
      });
      if (res.ok) {
        var me = await res.json().catch(function(){ return null; });
        if (window.__rememberName) window.__rememberName(me);
        window.location.assign(destination());
        return;
      }
      if (res.status === 429) {
        var wait = res.headers.get("Retry-After");
        say("Too many attempts. Try again" + (wait ? " in " + wait + " seconds." : " shortly."));
      } else if (res.status === 401) {
        /* The server's own wording. It does not say whether the account
           exists, and neither does this. */
        say("Invalid username or password.");
        p.value = "";
        p.focus();
      } else {
        /* Never render the body: it may carry server detail. */
        say("Sign-in is unavailable right now. Please try again.");
      }
    } catch (e) {
      say("Cannot reach the server. Check your connection and try again.");
    } finally {
      btn.removeAttribute("aria-busy");
      btn.firstChild.nodeValue = original;
    }
  }

  btn.addEventListener("click", function (e) { e.preventDefault(); submit(); });
  form.addEventListener("submit", function (e) { e.preventDefault(); submit(); });
  [u, p].forEach(function (el) {
    el.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
    el.addEventListener("input", clear);
  });

  /* Already signed in? Skip the form -- UNLESS this is a recovery visit.
   *
   * Password recovery lives on this same page, at ?forgot=1 and ?reset=<token>.
   * Without the guard below, anyone who still had a session was bounced into
   * the app the instant they opened either -- so "Forgot password?" could not
   * be reached at all by the people most likely to click it, and a reset link
   * arriving by email silently opened the dashboard instead of asking for a
   * new password.
   *
   * A reset link especially must work while signed in: the usual reason for
   * resetting is believing somebody ELSE is signed in as you. */
  var recovering = q.get("forgot") || q.get("reset");
  fetch("/api/auth/me", { credentials: "same-origin" })
    .then(function (r) {
      if (r.ok && !reason && !recovering) window.location.assign(destination());
    })
    .catch(function () { /* offline: leave the form up */ });
})();
</script>
<script>
/* ---------------------------------------------------------------------------
   The provider buttons.

   Each one hands off to /api/auth/oauth/<provider>/start, which mints a
   single-use state, stores the PKCE verifier server-side, and redirects to the
   provider. No client id, client secret or callback URL appears in this file
   and none should ever be added to it -- provider configuration belongs on the
   server, never in a page the browser can read.

   The page asks the server which providers are configured. One that is not
   says so in place rather than sending somebody through a redirect that was
   never going to work. Apple is not implemented server-side at all (it needs a
   paid Apple Developer Program account and an ES256-signed JWT rather than a
   client secret), so it always shows the notice.
--------------------------------------------------------------------------- */
(function () {
  var soc = document.querySelector(".soc");
  if (!soc) return;

  var note = document.createElement("div");
  note.className = "msg socmsg";
  note.setAttribute("role", "status");
  soc.insertAdjacentElement("afterend", note);

  /* Same same-site rule the password form uses: never hand an off-site URL to
     the server as the place to land after authenticating. */
  function destination() {
    var next = new URLSearchParams(window.location.search).get("next") || "/";
    if (next.charAt(0) !== "/" || next.charAt(1) === "/") return "/";
    if (next.indexOf("autotrader_sign") !== -1) return "/";
    return next;
  }

  var configured = {};
  function keyFor(b) { return (b.textContent || "").trim().toLowerCase(); }

  function say(who) {
    note.textContent = who + " sign-in is not connected yet — " +
                       "use your username and password above.";
    note.className = "msg socmsg show note";
  }

  Array.prototype.forEach.call(soc.querySelectorAll("button"), function (b) {
    b.addEventListener("click", function (e) {
      e.preventDefault();
      var key = keyFor(b);
      var who = (b.textContent || "That provider").trim();

      /* Always go. Do NOT gate this on the fetch below.
       *
       * This used to read `if (!configured[key]) { say(who); return; }`, and
       * `configured` is filled asynchronously -- so in the window before that
       * request came back, the map was empty and EVERY provider answered "not
       * connected yet", including all four that were configured perfectly
       * well. The window is invisible on a fast connection and seconds wide on
       * a slow one. Clicking a button the moment it appears is not an edge
       * case; it is what people do.
       *
       * The server already owns this decision and answers it correctly: an
       * unconfigured provider redirects straight back here with
       * ?reason=oauth_unconfigured, which is handled below. A second copy of
       * that judgement in the page could only ever disagree with the real one
       * -- and its initial value made it disagree in the worst direction. */
      if (configured[key] === false) { say(who); return; }
      note.textContent = "Redirecting to " + who + "…";
      note.className = "msg socmsg show info";
      window.location.assign("/api/auth/oauth/" + key + "/start?next=" +
                             encodeURIComponent(destination()));
    });
  });

  /* Still fetched, but now only to mark a provider that is genuinely off --
     information shown up front, not permission to click. Undefined (not yet
     known, or the request failed) means GO and let the server answer. */
  fetch("/api/auth/oauth/providers", { credentials: "same-origin" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) {
      if (!j || !j.providers) return;
      j.providers.forEach(function (p) {
        configured[p.key] = !!p.configured;
        if (p.configured) return;
        Array.prototype.forEach.call(soc.querySelectorAll("button"), function (b) {
          if (keyFor(b) === p.key) { b.classList.add("soc-off"); b.title =
            p.label + " sign-in is not connected yet."; }
        });
      });
    })
    .catch(function () { /* unknown is not "off": the click still goes. */ });
})();
</script>
<script>
/* ---------------------------------------------------------------------------
   Password recovery, in two modes of this same card.

     ?forgot=1        ask for an address and send a link
     ?reset=<token>   set a new password with the link that arrived

   The alternative was a third page, which would have meant a third copy of the
   inlined photograph and flag font -- roughly 650 KB -- to show two fields.
--------------------------------------------------------------------------- */
(function () {
  var q = new URLSearchParams(window.location.search);
  var forgot = q.get("forgot");
  var token = q.get("reset");
  if (!forgot && !token) return;

  var form = document.querySelector("form.card");
  if (!form) return;
  document.body.classList.add("recovery");

  var head = document.querySelector(".hello h2");
  var sub = document.querySelector(".hello p");
  var btn = form.querySelector(".go");
  var msg = form.querySelector(".msg:not(.socmsg)");
  if (!msg) {
    msg = document.createElement("div");
    msg.className = "msg";
    msg.setAttribute("role", "status");
    btn.insertAdjacentElement("afterend", msg);
  }
  function say(text, kind) {
    msg.textContent = text;
    msg.className = "msg show " + (kind || "err");
  }

  /* Everything that belongs to signing in goes away: the tabs, the provider
     row and its divider, the remember-me line, and whichever field this mode
     does not use. */
  [".tabs", ".or", ".soc", ".socmsg", ".row"].forEach(function (sel) {
    var el = form.querySelector(sel) || document.querySelector(sel);
    if (el) el.classList.add("hide-in-recovery");
  });

  var uBox = document.getElementById("u") &&
             document.getElementById("u").closest(".f");
  var pBox = document.getElementById("p") &&
             document.getElementById("p").closest(".f");

  var back = document.createElement("a");
  back.className = "backlink";
  back.href = "autotrader_signin.html";
  back.textContent = "Back to sign in";
  form.appendChild(back);

  /* Replace the submit path outright. Cloning drops the sign-in listeners, so
     one click cannot fire both this and a login attempt. */
  var fresh = btn.cloneNode(true);
  btn.parentNode.replaceChild(fresh, btn);
  function label(text) {
    if (fresh.childNodes.length) fresh.childNodes[0].nodeValue = text + " ";
  }

  async function post(path, body) {
    var res = await fetch(path, {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    var payload = await res.json().catch(function () { return {}; });
    return { ok: res.ok, status: res.status, body: payload };
  }

  if (forgot) {
    // ── ask for an address ──────────────────────────────────────────────
    if (pBox) pBox.classList.add("hide-in-recovery");
    if (head) head.textContent = "Reset your password";
    if (sub) sub.textContent = "We will email you a link to set a new one.";
    label("Send reset link");

    var u = document.getElementById("u");
    if (u) {
      u.type = "email";
      u.name = "email";
      u.setAttribute("placeholder", "Email Address");
      u.setAttribute("autocomplete", "email");
      u.value = "";
    }

    fresh.addEventListener("click", async function (e) {
      e.preventDefault();
      var email = (u && u.value || "").trim();
      if (!email) { say("Please enter your email address."); return; }
      fresh.setAttribute("aria-busy", "true");
      try {
        var r = await post("/api/auth/forgot-password",
                           { email: email, captcha_token: window.__captchaToken || "" });
        /* The server answers the same way whether or not that address has an
           account -- on purpose, so this cannot be used to discover who has
           one. So this reports what the server said and nothing more. */
        say(r.body.detail || "If that address has an account, a link is on its way.",
            r.ok ? "info" : "err");
        if (r.ok && u) u.value = "";
      } catch (err) {
        say("Cannot reach the server. Check your connection and try again.");
      } finally {
        fresh.removeAttribute("aria-busy");
      }
    });
  } else {
    // ── set a new password ──────────────────────────────────────────────
    if (uBox) uBox.classList.add("hide-in-recovery");
    if (head) head.textContent = "Choose a new password";
    if (sub) sub.textContent = "Make it long. Length beats punctuation.";
    label("Set password");

    var p = document.getElementById("p");
    if (p) {
      p.setAttribute("placeholder", "New Password");
      p.setAttribute("autocomplete", "new-password");
      p.value = "";
    }

    /* A confirm field, because a typo here locks someone out of the account
       they are in the middle of recovering. */
    var second = pBox.cloneNode(true);
    var p2 = second.querySelector("input");
    p2.id = "p2";
    p2.value = "";
    p2.setAttribute("placeholder", "Confirm New Password");
    p2.setAttribute("autocomplete", "new-password");
    var eye = second.querySelector(".eye");
    if (eye) {
      eye.addEventListener("click", function () {
        p2.type = p2.type === "password" ? "text" : "password";
      });
    }
    pBox.insertAdjacentElement("afterend", second);

    fresh.addEventListener("click", async function (e) {
      e.preventDefault();
      var a = (p && p.value) || "", b = p2.value || "";
      if (!a) { say("Please choose a new password."); return; }
      if (a !== b) { say("The two passwords do not match."); return; }
      fresh.setAttribute("aria-busy", "true");
      try {
        var r = await post("/api/auth/reset-password", { token: token, password: a });
        if (r.ok) {
          /* The reset signed us in and revoked every other session. */
          window.location.assign("/");
          return;
        }
        say(r.body.detail || "Could not set that password. Please try again.");
      } catch (err) {
        say("Cannot reach the server. Check your connection and try again.");
      } finally {
        fresh.removeAttribute("aria-busy");
      }
    });
  }
})();
</script>

<script>
/* ---------------------------------------------------------------------------
   "Forgot username?" -- the third recovery mode of this card.

   Sign-in is by USERNAME. Someone who remembers their email and forgets their
   username is locked out exactly as completely as someone who forgot the
   password, and password reset does not rescue them: it asks for the address
   and then never tells them what the username is.

   Same shape as ?forgot=1, including the CAPTCHA -- this also sends mail on
   demand to an address the caller picks.
--------------------------------------------------------------------------- */
(function () {
  var q = new URLSearchParams(window.location.search);
  if (!q.get("forgotuser")) return;

  var form = document.querySelector("form.card");
  if (!form) return;
  document.body.classList.add("recovery");

  var head = document.querySelector(".hello h2");
  var sub = document.querySelector(".hello p");
  var btn = form.querySelector(".go");
  var msg = form.querySelector(".msg:not(.socmsg)");
  if (!msg) {
    msg = document.createElement("div");
    msg.className = "msg";
    msg.setAttribute("role", "status");
    btn.insertAdjacentElement("afterend", msg);
  }
  function say(t, kind) { msg.textContent = t; msg.className = "msg show " + (kind || "err"); }

  [".tabs", ".or", ".soc", ".socmsg", ".row"].forEach(function (sel) {
    var el = form.querySelector(sel) || document.querySelector(sel);
    if (el) el.classList.add("hide-in-recovery");
  });
  var pBox = document.getElementById("p") && document.getElementById("p").closest(".f");
  if (pBox) pBox.classList.add("hide-in-recovery");

  if (head) head.textContent = "Find your username";
  if (sub) sub.textContent = "We will email it to the address on your account.";
  if (btn && btn.childNodes.length) btn.childNodes[0].nodeValue = "Email my username ";

  var u = document.getElementById("u");
  if (u) {
    u.type = "email"; u.name = "email"; u.value = "";
    u.setAttribute("placeholder", "Email Address");
    u.setAttribute("autocomplete", "email");
  }

  var back = document.createElement("a");
  back.className = "backlink";
  back.href = "autotrader_signin.html";
  back.textContent = "Back to sign in";
  form.appendChild(back);

  /* Cloning drops the sign-in listeners so one click cannot also try to log in. */
  var fresh = btn.cloneNode(true);
  btn.parentNode.replaceChild(fresh, btn);

  fresh.addEventListener("click", async function (e) {
    e.preventDefault();
    var email = (u && u.value || "").trim();
    if (!email) { say("Please enter your email address."); return; }
    fresh.setAttribute("aria-busy", "true");
    try {
      var res = await fetch("/api/auth/forgot-username", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email,
                               captcha_token: window.__captchaToken || "" }),
      });
      var body = await res.json().catch(function () { return {}; });
      /* The server answers the same way whether or not that address has an
         account, so this reports what it said and adds nothing. */
      say(body.detail || "If that address has an account, the username is on its way.",
          res.ok ? "info" : "err");
      if (res.ok && u) u.value = "";
    } catch (err) {
      say("Cannot reach the server. Check your connection and try again.");
    } finally {
      fresh.removeAttribute("aria-busy");
    }
  });
  form.addEventListener("submit", function (e) { e.preventDefault(); fresh.click(); });
})();
</script>
