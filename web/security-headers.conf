# Security response headers, in one file because nginx makes sharing them hard.
#
# WHY A SNIPPET AND NOT LINES IN THE SERVER BLOCK
# -----------------------------------------------
# add_header does NOT accumulate down the hierarchy. A location that sets ANY
# add_header of its own silently discards every one inherited from its parent
# -- so putting these in the server block alone would apply them to most of the
# site and drop all of them on exactly the three locations that set a
# Cache-Control: the two auth pages, index.html, and /assets/. The sign-in page
# is the last place that should lose its framing protection.
#
# So this is included in the server block AND in every location that carries an
# add_header of its own. There is no macro in nginx; an include is the closest
# thing, and it means the list exists once.
#
# It is included by BOTH nginx.conf (port 80) and ssl.conf.template (port 443).
# HSTS is deliberately NOT here -- see the note at the bottom.

# Clickjacking. frame-ancestors is the modern control and X-Frame-Options is
# the one older browsers honour; both, because the cost is a header.
# A sign-in form in an invisible iframe over someone else's page is the
# textbook attack, and this application has one.
add_header X-Frame-Options "DENY" always;

# Stop a browser second-guessing a declared Content-Type. Without it a file
# served as text/plain can be executed as script if the sniffer decides it
# looks like one.
add_header X-Content-Type-Options "nosniff" always;

# Referer leakage. The confirmation and reset links carry their token in the
# QUERY STRING -- unavoidable for a link someone clicks out of an email -- and
# the default referrer policy would put that whole URL, token included, in the
# Referer header of any request the page makes to another origin. Today the
# sign-in page loads nothing external, so this is defence in depth rather than
# a live hole; it stays correct the first time someone adds a font or a script
# to that page.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Nothing here needs a camera, a microphone or a location, so nothing may ask.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Content Security Policy.
#
# 'unsafe-inline' for script-src is a genuine weakness and it is honest to name
# it: the sign-in, sign-up, help, legal and 404 pages are single self-contained
# files with their inline <script> and <style> blocks, and this application is
# served under a policy that has to accommodate them. Removing it means giving
# every one of those blocks a per-request nonce, which needs a template engine
# in front of what are currently static files -- a real change, not a tweak.
#
# What the rest of the policy still buys, all of which is live:
#   frame-ancestors  clickjacking, and it beats X-Frame-Options where both apply
#   form-action      a script cannot repoint the login form at another host
#   base-uri         a script cannot rewrite relative URLs by injecting <base>
#   object-src       no Flash/applet embedding
#   connect-src      an injected script cannot exfiltrate to another origin
#
# challenges.cloudflare.com is Turnstile, which the sign-up page loads and
# renders in an iframe.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# HSTS IS NOT HERE ON PURPOSE.
#
# It belongs only on the TLS server -- ssl.conf.template adds it -- because a
# browser must not be told to force HTTPS by a reply that arrived over plain
# HTTP, and because this file is also included by the port 80 server, which
# exists to serve the ACME challenge and redirect.
