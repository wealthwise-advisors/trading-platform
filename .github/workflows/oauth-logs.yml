name: Read production logs (manual, read-only)

# The only way to read this application's logs.
#
# Written to answer one question -- why X sign-in returned people to the
# sign-in page -- and kept, because that question could not be answered without
# it. Nothing else reaches the running container's stdout: the deploy prints
# health checks, not application logs.
#
# It earns its keep now that logging works at all. Until api/main.py called
# basicConfig, the app's own lines did not exist to be read -- stdlib records
# had no handler, so every reason behind an OAuth refusal, a throttle or a
# rejected recovery was written into nothing. This reads what that fix made
# real.
#
# What it will not do is print a secret. Credentials are reported as a LENGTH
# and an 8-character hash -- enough to catch the faults that actually happen
# (an empty value, a trailing newline, a pasted quote) and nothing more.
# Database output is counts, timestamps, and a 6-character subject prefix;
# never a token hash, never an address.
#
# Port 22 is opened for this runner's IP alone and closed again in an always()
# step, so it closes on failure too.

on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      # The box only pulls during a DEPLOY, so a script added since the
      # last deploy is not there yet. Carry it from the runner rather than
      # assuming the server is current -- that assumption is why the first
      # run of this printed "could not run the doctor".
      - uses: actions/checkout@v4

      - name: Resolve this runner's public IP
        id: ip
        run: echo "addr=$(curl -fsS --max-time 15 https://checkip.amazonaws.com | tr -d '\n')" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Open port 22 for this runner only
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.EC2_SG_ID }}" \
            --protocol tcp --port 22 \
            --cidr "${{ steps.ip.outputs.addr }}/32"

      - name: Install the SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Send the diagnostic script up
        run: |
          scp -o BatchMode=yes -o ConnectTimeout=20 \
              scripts/schwab_token_doctor.py \
              ec2-user@"${{ secrets.EC2_HOST }}":/tmp/schwab_token_doctor.py

      - name: What did the callback actually decide?
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
              ec2-user@"${{ secrets.EC2_HOST }}" bash -euo pipefail <<'REMOTE'
            echo "===== every oauth line the app has logged ====="
            docker logs repo-api-1 2>&1 \
              | grep -iE 'oauth|twitter|x\.com' \
              | tail -60 | sed 's/^/  /' || echo "  (none found)"

            echo
            echo "===== anything that blew up ====="
            docker logs repo-api-1 2>&1 \
              | grep -iE 'traceback|error|exception|refused|failed' \
              | tail -30 | sed 's/^/  /' || echo "  (none found)"

            echo
            echo "===== did the callback PARK an identity, or refuse it? ====="
            # This is the decisive question and the database answers it without
            # any logging at all. Reaching NEEDS_DETAILS writes an oauth_pending
            # row; every refusal writes nothing. So a row here means the X
            # round-trip SUCCEEDED and the person was sent to choose a username
            # -- and no row means it was refused before that point.
            #
            # Counts and timestamps only. Never the token hash, which is the
            # one column that would be worth stealing.
            # One line per query. An indented heredoc cannot carry Python
            # inside a YAML block scalar -- the interpreter needs column 0 and
            # the YAML needs indentation, and they cannot both have it.
            Q='import sqlite3,os,json;c=sqlite3.connect(os.environ.get("AUTOTRADER_DB_PATH","data/autotrader.db"));c.row_factory=sqlite3.Row;p=lambda q:[print("   ",dict(r)) for r in c.execute(q)]'
            docker exec repo-api-1 python -c \
              "$Q;print('  parked, waiting for a username:');p('SELECT provider,substr(subject,1,6) AS subj,suggested,created_at,expires_at FROM oauth_pending ORDER BY created_at')" \
              || echo "  (could not query oauth_pending)"
            docker exec repo-api-1 python -c \
              "$Q;print('  completed provider links:');p('SELECT provider,COUNT(*) AS n FROM oauth_identities GROUP BY provider')" \
              || echo "  (could not query oauth_identities)"
            docker exec repo-api-1 python -c \
              "$Q;print('  accounts:');p('SELECT COUNT(*) AS total,SUM(has_password) AS with_password FROM users')" \
              || echo "  (could not query users)"

            echo
            echo "===== Schwab token: shape only, never values ====="
            # The provider swallows the reason in a bare except, so the UI can
            # only ever say "Not authenticated" -- the same sentence for a
            # missing file, a malformed one, the right data under the wrong
            # keys, and a genuinely expired token. This tells them apart.
            #
            # Shipped as a real script and copied in, rather than inlined:
            # multi-line Python cannot live in a YAML block scalar, because the
            # interpreter needs column 0 and the YAML needs indentation.
            ls -l --time-style=long-iso                /opt/wealthwise/repo/config/schwab_tokens.json 2>&1               | sed 's/^/  host: /' || echo "  host: no such file"
            docker cp /tmp/schwab_token_doctor.py                       repo-api-1:/tmp/_doctor.py >/dev/null 2>&1               && docker exec repo-api-1 python /tmp/_doctor.py 2>&1 | sed 's/^/  /'               || echo "  (could not run the doctor)"
            docker exec repo-api-1 rm -f /tmp/_doctor.py 2>/dev/null || true

            echo
            echo "===== are the X credentials actually IN the container? ====="
            # Length and a short hash only. A length is enough to catch the
            # classic faults -- an empty value, or a key pasted with a trailing
            # newline or a quote -- without ever printing the secret.
            docker exec repo-api-1 sh -c '
              for v in AUTOTRADER_TWITTER_CLIENT_ID AUTOTRADER_TWITTER_CLIENT_SECRET \
                       AUTOTRADER_PUBLIC_BASE_URL; do
                eval "val=\$$v"
                if [ -z "$val" ]; then
                  printf "  %-38s ABSENT\n" "$v"
                else
                  printf "  %-38s len=%-4s sha=%s\n" "$v" "${#val}" \
                    "$(printf %s "$val" | sha256sum | cut -c1-8)"
                fi
              done
            ' || echo "  (could not read the environment)"
          REMOTE

      - name: Close port 22
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.EC2_SG_ID }}" \
            --protocol tcp --port 22 \
            --cidr "${{ steps.ip.outputs.addr }}/32" || true
