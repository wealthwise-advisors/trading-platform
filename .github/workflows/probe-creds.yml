name: Probe credential locations (temporary, read-only)

# The migration moved the app from /opt/wealthwise/repo/trading-platform up to
# /opt/wealthwise/repo. The compose mount moved with it. Any gitignored
# credentials.yaml under the OLD path would have been left behind -- `git clean
# -fd` has no -x, so it spares ignored files. That is exactly how the port-80
# override was stranded.
#
# Read-only. Lists filenames, sizes and modification times only. It never reads,
# prints or copies the contents of any credential file.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve this runner's public IP
        id: ip
        run: echo "addr=$(curl -fsS --max-time 15 https://checkip.amazonaws.com | tr -d '\n')" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Open port 22 for this runner only
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.EC2_SG_ID }}" \
            --protocol tcp --port 22 \
            --cidr "${{ steps.ip.outputs.addr }}/32"

      - name: Install the SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Where do credential files actually live?
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
              ec2-user@"${{ secrets.EC2_HOST }}" bash -euo pipefail <<'REMOTE'
            echo "===== the ACTIVE config dir the container mounts ====="
            ls -la /opt/wealthwise/repo/config/ 2>/dev/null | sed 's/^/  /' || echo "  (missing)"

            echo
            echo "===== the OLD app dir -- did the move strand anything? ====="
            if [ -d /opt/wealthwise/repo/trading-platform ]; then
              echo "  /opt/wealthwise/repo/trading-platform STILL EXISTS:"
              find /opt/wealthwise/repo/trading-platform -maxdepth 3 -type f 2>/dev/null \
                | head -20 | sed 's/^/    /'
            else
              echo "  /opt/wealthwise/repo/trading-platform does not exist"
            fi

            echo
            echo "===== any credentials.yaml or token file anywhere under /opt ====="
            sudo find /opt -name 'credentials.yaml*' -o -name 'schwab_tokens.json*' 2>/dev/null \
              | while read -r f; do
                  printf '  %-70s %8s bytes  %s\n' "$f" "$(stat -c%s "$f")" "$(stat -c%y "$f" | cut -d' ' -f1)"
                done
            echo "  (filenames and sizes only -- contents never read)"

            echo
            echo "===== what the api container sees at /app/config ====="
            docker exec repo-api-1 sh -c 'ls -la /app/config' 2>/dev/null | sed 's/^/  /' || echo "  (could not list)"

            echo
            echo "===== the container's own view of the error ====="
            docker exec repo-api-1 sh -c 'ls /app/config/credentials.yaml 2>&1' | sed 's/^/  /'
          REMOTE

      - name: Close port 22
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.EC2_SG_ID }}" \
            --protocol tcp --port 22 \
            --cidr "${{ steps.ip.outputs.addr }}/32" || true
