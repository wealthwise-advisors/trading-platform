# Root CI — this is the workflow GitHub actually runs.
#
# GitHub Actions only discovers workflows in .github/workflows/ at the
# REPOSITORY ROOT. The platform keeps its own copy at
# a copy inside the app directory so it stays valid as a
# standalone project, but that copy is inert here — nothing triggers it.
#
# The application lives at the repository root here, so no step is scoped via
# `defaults.run.working-directory`. Keep the two in sync when either changes.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      # Config (ignore list, exclude) lives in pyproject.toml's [tool.ruff]
      # -- see that file's comment for why E741/E731 are ignored (pre-
      # existing, audited findings).
      - run: ruff check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      # Informational for now -- see docs/RELEASE_AUDIT.md ("Code Quality
      # Audit"): 36 pre-existing type errors were found in src/analysis/
      # and are not fixed here. continue-on-error keeps this job visible
      # in the CI summary without blocking merges until that's addressed
      # as its own, separate task.
      - run: mypy src/analysis --ignore-missing-imports
        continue-on-error: true

  unit-tests:
    name: Unit + smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      # Full suite: engine smoke tests + the swing/zigzag regression baseline
      # + the Elliott Wave suite, including every TR-2 blocked-rule guard.
      # See docs/ELLIOTT_WAVE_SRS.md TR-11 (D-05).
      #
      # Coverage runs here rather than in a job of its own: it needs the same
      # install and the same full suite, so a second job would pay for both
      # again to print one number. Reported to the log only -- no file is kept
      # and nothing is uploaded, so the figure can be read off a run without
      # this repo depending on a third-party service. What counts as covered
      # is configured in pyproject.toml's [tool.coverage.run].
      #
      # The gate is 70, not the 77.5 the suite currently reaches. A threshold
      # set at the current number fails on any change that lands a few
      # uncovered lines, including good ones, and the predictable response to
      # that is lowering the threshold -- which is worse than not having one.
      # Seven points of headroom absorbs normal movement and still catches a
      # real slide.
      - run: pytest tests/ -v --cov=src --cov=api --cov-report=term --cov-fail-under=70

  build:
    name: Package build
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install build
      - run: python -m build --wheel
      # `path` is resolved from the repo root, not working-directory.
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  security:
    name: Security audit (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          pip install -e ".[dev]"
          # src/data/schwabdev excluded: vendored third-party client with
          # a documented, real, systemic finding (23 requests calls with
          # no timeout) that isn't fixed here -- see docs/SECURITY_AUDIT.md.
          # Its own code isn't ours to gate CI on. The 3 SQL-shaped
          # warnings elsewhere are individually suppressed inline
          # (`# nosec B608`) at their exact, verified-safe lines, not
          # blanket-ignored -- this command should exit 0.
          bandit -r src api -ll -q --exclude src/data/schwabdev
      - run: pip-audit --desc
        continue-on-error: true   # informational -- see docs/SECURITY_AUDIT.md; upstream CVE fixes aren't in our control on every run

  frontend:
    name: Frontend (vitest + tsc + oxlint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Vitest guards the timestamp-convention bugs that twice made chart
      # traces render off-axis while every other check stayed green. Runs in
      # the node environment -- no browser, no jsdom, ~200ms.
      - run: npm test
      # tsc -b, not --noEmit: the root tsconfig is a solution file with
      # "files": [], so --noEmit type-checks nothing and always exits 0.
      - run: npx tsc -b --force
      - run: npx oxlint src
