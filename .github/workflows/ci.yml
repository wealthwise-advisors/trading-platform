name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      # Config (ignore list, exclude) lives in pyproject.toml's [tool.ruff]
      # -- see that file's comment for why E741/E731 are ignored (pre-
      # existing, audited findings inside the protected Elliott engine,
      # not touched per Task 10's "do not modify Elliott algorithms").
      - run: ruff check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          pip install -e ".[dev]"
      # Informational for now -- see docs/RELEASE_AUDIT.md ("Code Quality
      # Audit"): 36 pre-existing type errors were found in src/analysis/
      # (the protected Elliott engine) and are not fixed per Task 10's
      # explicit instruction not to modify that code. continue-on-error
      # keeps this job visible in the CI summary without blocking merges
      # until that's addressed as its own, separate task.
      - run: mypy src/analysis --ignore-missing-imports
        continue-on-error: true

  unit-tests:
    name: Unit + smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      - run: pytest tests/test_engine.py -v

  regression-tests:
    name: Elliott Wave regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      - run: pytest tests/elliott -v --cov=src/analysis --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  benchmark:
    name: Independent industry benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      # Rebuilds benchmark.db from scratch (104 synthetic + 369 real-market
      # cases, see benchmark/TASK9_IMPROVEMENT_REPORT.md) and fails the job
      # if agreement drops outside the range already measured and reported
      # -- a real regression gate, not just "did it run".
      - run: |
          python -m benchmark.populate_all
          python -c "
          from benchmark.db import connect
          from benchmark import metrics
          with connect() as conn:
              s = metrics.full_summary(conn)
          a = s['agreement']['primary_agreement_pct']
          repro = s['reproducibility']['deterministic_pct']
          print(f'agreement={a:.1%} reproducibility={repro:.1%}')
          assert repro == 1.0, f'benchmark determinism regressed: {repro:.1%} (expected 100%)'
          assert a >= 0.20, f'synthetic archetype agreement dropped below 20% floor: {a:.1%}'
          "
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-db
          path: benchmark/benchmark.db

  build:
    name: Package build
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, regression-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install build
      - run: python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  security:
    name: Security audit (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          pip install -e ".[dev]"
          # src/data/schwabdev excluded: vendored third-party client with
          # a documented, real, systemic finding (23 requests calls with
          # no timeout) that isn't fixed here -- see docs/SECURITY_AUDIT.md.
          # Its own code isn't ours to gate CI on. The 3 SQL-shaped
          # warnings elsewhere are individually suppressed inline
          # (`# nosec B608`) at their exact, verified-safe lines, not
          # blanket-ignored -- this command should exit 0.
          bandit -r src api benchmark validation -ll -q --exclude src/data/schwabdev
      - run: pip-audit --desc
        continue-on-error: true   # informational -- see docs/SECURITY_AUDIT.md; upstream CVE fixes aren't in our control on every run
