# Deploy to the EC2 host on every push to main.
#
# WHY THIS OPENS AND CLOSES A FIREWALL RULE
# -----------------------------------------
# The instance's security group allows SSH only from the maintainer's own IP.
# GitHub-hosted runners have dynamic addresses drawn from thousands of ranges,
# far past the 60-rule limit on a security group, so they cannot be allowlisted
# up front. Instead this job authorises the single runner IP for the length of
# the deploy and revokes it in an `always()` step, so port 22 is never open to
# anything but the maintainer between deploys.
#
# The AWS credentials used here belong to the `wealthwise-ci` IAM user, whose
# entire policy is AuthorizeSecurityGroupIngress + RevokeSecurityGroupIngress
# on this one security group, plus DescribeSecurityGroups. It cannot see or
# touch the instance itself -- verified: ec2:DescribeInstances and
# ec2:TerminateInstances both return AccessDenied for it.
#
# The server pulls with --depth 1. Kept from the previous deployment repo,
# where an old commit contained live Schwab OAuth tokens reachable in a full
# clone. That history was deliberately NOT migrated here, so this repository
# is clean -- the shallow fetch stays because it costs nothing and the server
# has no need of history.

name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:        # manual redeploy from the Actions tab

concurrency:
  group: deploy-ec2         # never let two deploys race on one box
  cancel-in-progress: false

jobs:
  # A DEPLOY GATE, not a duplicate of CI.
  #
  # Deploy triggers on push to main and used to do so regardless of what CI
  # said: the two workflows started in parallel, so a red suite still shipped.
  # For most failures that is merely untidy. For this suite it is the whole
  # problem -- it guards the numbers a client reads off the screen, and bar
  # construction has silently regressed after a green-looking change three
  # times now. So the box is not touched until it passes.
  #
  # Scoped to the one suite deliberately. Widening it to the full test run
  # would couple every deploy to every unrelated flake and the gate would get
  # switched off within a month, which is the usual way a gate like this dies.
  correctness-gate:
    name: Indicator correctness (blocks the deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Both: one checks the app against an independent recompute, the other
      # against bars the reference platform actually printed. The first cannot
      # catch a wrong DEFINITION -- it shares the definition -- which is how a
      # bar grid anchored on the wrong point stayed green for a week.
      - run: pytest tests/test_indicator_correctness.py tests/test_reference_platform_parity.py -q

  deploy:
    name: Build and deploy to EC2
    needs: correctness-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Resolve this runner's public IP
        id: ip
        run: echo "addr=$(curl -fsS --max-time 15 https://checkip.amazonaws.com | tr -d '\n')" >> "$GITHUB_OUTPUT"

      - name: Open SSH for this runner only
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.EC2_SG_ID }}" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${{ steps.ip.outputs.addr }}/32,Description='gh-actions run ${{ github.run_id }}'}]"

      - name: Install the deploy SSH key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Authorising the security group rule is not instant -- the API
          # returns before the rule is necessarily enforcing. A single
          # ssh-keyscan right after it can hit a still-closed port, and because
          # this step runs under `bash -e` with stderr sent to /dev/null, that
          # used to fail the whole deploy with no visible reason (run
          # 31584046674). Retry until the host answers.
          for attempt in $(seq 1 12); do
            if ssh-keyscan -T 5 -t rsa,ed25519 "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null \
               && [ -s ~/.ssh/known_hosts ]; then
              echo "host key collected on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt: port 22 not answering yet, waiting..."
            sleep 5
          done
          echo "Could not reach ${{ secrets.EC2_HOST }}:22 after 60s — the security group rule never took effect."
          exit 1

      - name: Pull and rebuild on the host
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
              ec2-user@"${{ secrets.EC2_HOST }}" bash -euo pipefail <<'REMOTE'
            # Actions substitutes this before the remote shell sees it, so the
            # deploy always follows the branch that triggered it.
            DEPLOY_BRANCH="${{ github.ref_name }}"

            cd /opt/wealthwise/repo

            # The checkout on this box was cloned from the previous repository.
            # Re-point it, idempotently, so the cutover needs no manual SSH.
            # Requires the box's existing deploy key to be registered on this
            # repo as well -- same key, it just has to be added here too.
            # github-wwa is a host alias in the box's ~/.ssh/config that maps to
            # github.com with this repository's own deploy key. A deploy key is
            # scoped to one repo and ssh does not retry after a successful
            # authentication, so the previous repo's key cannot be reused here --
            # the two must be reached through separate Host entries.
            WANT="git@github-wwa:${{ github.repository }}.git"
            if [ "$(git remote get-url origin)" != "$WANT" ]; then
              echo "re-pointing origin -> $WANT"
              git remote set-url origin "$WANT"
            fi

            # Shallow fetch: history (and its old token blobs) never lands here.
            git fetch --depth 1 origin "$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"
            git clean -fd -e docker-compose.override.yml
            echo "now at: $(git log --oneline -1)"

            docker compose up --build -d --remove-orphans
            docker image prune -f          # t3.micro has an 8 GiB disk
          REMOTE

      - name: Wait for the API to report healthy
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                   "http://${{ secrets.EC2_HOST }}/api/health" || true)
            if [ "$code" = "200" ]; then echo "healthy after $((i*5))s"; exit 0; fi
            sleep 5
          done
          echo "API did not become healthy"; exit 1

      - name: Smoke test the deployed app
        run: |
          set -e
          curl -fsS --max-time 20 "http://${{ secrets.EC2_HOST }}/" | grep -q '<title>AutoTrader</title>'
          echo "  dashboard served"
          curl -fsS --max-time 20 "http://${{ secrets.EC2_HOST }}/api/strategies" | grep -q 'rsi_divergence'
          echo "  API responding through the single origin"

      - name: Close SSH again
        if: always()          # runs even when an earlier step fails
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.EC2_SG_ID }}" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${{ steps.ip.outputs.addr }}/32}]" \
            || echo "rule already gone"
