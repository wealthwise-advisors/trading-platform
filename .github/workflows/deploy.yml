# Deploy to the EC2 host on every push to main.
#
# WHY THIS OPENS AND CLOSES A FIREWALL RULE
# -----------------------------------------
# The instance's security group allows SSH only from the maintainer's own IP.
# GitHub-hosted runners have dynamic addresses drawn from thousands of ranges,
# far past the 60-rule limit on a security group, so they cannot be allowlisted
# up front. Instead this job authorises the single runner IP for the length of
# the deploy and revokes it in an `always()` step, so port 22 is never open to
# anything but the maintainer between deploys.
#
# The AWS credentials used here belong to the `wealthwise-ci` IAM user, whose
# entire policy is AuthorizeSecurityGroupIngress + RevokeSecurityGroupIngress
# on this one security group, plus DescribeSecurityGroups. It cannot see or
# touch the instance itself -- verified: ec2:DescribeInstances and
# ec2:TerminateInstances both return AccessDenied for it.
#
# The server pulls with --depth 1. Kept from the previous deployment repo,
# where an old commit contained live Schwab OAuth tokens reachable in a full
# clone. That history was deliberately NOT migrated here, so this repository
# is clean -- the shallow fetch stays because it costs nothing and the server
# has no need of history.

name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:        # manual redeploy from the Actions tab

concurrency:
  group: deploy-ec2         # never let two deploys race on one box
  cancel-in-progress: false

jobs:
  # A DEPLOY GATE, not a duplicate of CI.
  #
  # Deploy triggers on push to main and used to do so regardless of what CI
  # said: the two workflows started in parallel, so a red suite still shipped.
  # For most failures that is merely untidy. For this suite it is the whole
  # problem -- it guards the numbers a client reads off the screen, and bar
  # construction has silently regressed after a green-looking change three
  # times now. So the box is not touched until it passes.
  #
  # Scoped to the one suite deliberately. Widening it to the full test run
  # would couple every deploy to every unrelated flake and the gate would get
  # switched off within a month, which is the usual way a gate like this dies.
  correctness-gate:
    name: Indicator correctness (blocks the deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Both: one checks the app against an independent recompute, the other
      # against bars the reference platform actually printed. The first cannot
      # catch a wrong DEFINITION -- it shares the definition -- which is how a
      # bar grid anchored on the wrong point stayed green for a week.
      - run: pytest tests/test_indicator_correctness.py tests/test_reference_platform_parity.py -q

  deploy:
    name: Build and deploy to EC2
    needs: correctness-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Resolve this runner's public IP
        id: ip
        run: echo "addr=$(curl -fsS --max-time 15 https://checkip.amazonaws.com | tr -d '\n')" >> "$GITHUB_OUTPUT"

      - name: Open SSH for this runner only
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.EC2_SG_ID }}" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${{ steps.ip.outputs.addr }}/32,Description='gh-actions run ${{ github.run_id }}'}]"

      - name: Install the deploy SSH key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Authorising the security group rule is not instant -- the API
          # returns before the rule is necessarily enforcing. A single
          # ssh-keyscan right after it can hit a still-closed port, and because
          # this step runs under `bash -e` with stderr sent to /dev/null, that
          # used to fail the whole deploy with no visible reason (run
          # 31584046674). Retry until the host answers.
          for attempt in $(seq 1 12); do
            if ssh-keyscan -T 5 -t rsa,ed25519 "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null \
               && [ -s ~/.ssh/known_hosts ]; then
              echo "host key collected on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt: port 22 not answering yet, waiting..."
            sleep 5
          done
          echo "Could not reach ${{ secrets.EC2_HOST }}:22 after 60s — the security group rule never took effect."
          exit 1

      # Authenticates the server's `git fetch`. Replaces the SSH deploy key:
      # the token is minted per run, scoped to this repository alone, and
      # revoked when the job ends -- so no long-lived credential for GitHub
      # sits on the box at all. APP_ID is a public identifier rather than a
      # secret, so it falls back to the literal when the secret is unset.
      - name: Mint a GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID || '4607282' }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Pull and rebuild on the host
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
              ec2-user@"${{ secrets.EC2_HOST }}" bash -euo pipefail <<'REMOTE'
            # Actions substitutes these before the remote shell sees them, so
            # the token travels over ssh's encrypted stdin -- it is never an
            # argument, so it never appears in the box's process list.
            DEPLOY_BRANCH="${{ github.ref_name }}"
            REPO="${{ github.repository }}"
            TOKEN="${{ steps.app-token.outputs.token }}"

            cd /opt/wealthwise/repo

            # ---- Schwab credentials -----------------------------------------
            # Written from a repository secret, never committed. config/ is
            # gitignored for credentials.yaml, and `git clean -fd` leaves
            # gitignored files alone, so this survives every redeploy.
            #
            # Only the app key/secret live here. The OAuth tokens are obtained
            # through the app's own /api/schwab/complete-auth flow and written
            # to config/schwab_tokens.json by the container.
            #
            # Skipped entirely when the secret is unset, so a deploy without it
            # behaves exactly as before -- synthetic data, no live feed.
            CREDS_B64="${{ secrets.SCHWAB_CREDENTIALS_YAML_B64 }}"
            if [ -n "$CREDS_B64" ]; then
              mkdir -p config
              # The umask is scoped to a SUBSHELL on purpose. Set bare, it stays
              # in force for the rest of this script -- including `git reset
              # --hard` below, which then creates every NEW file mode 600. Those
              # modes are preserved by `docker build`'s COPY into the image, and
              # nginx's worker runs as `nginx`, so any newly added static asset
              # answered 403 Forbidden in production while every pre-existing
              # file kept its old 644 and worked. That is how the sign-in pages
              # 403'd on the deploy that first added them.
              ( umask 077; printf '%s' "$CREDS_B64" | base64 -d > config/credentials.yaml )
              chmod 600 config/credentials.yaml
              # Report shape only -- never the values.
              echo "credentials.yaml written: $(wc -c < config/credentials.yaml) bytes, keys: $(grep -cE '^[a-z_]+:' config/credentials.yaml)"
            else
              echo "SCHWAB_CREDENTIALS_YAML_B64 not set -- live data stays disabled"
            fi

            # ---- Schwab OAuth tokens (one-time seed) -------------------------
            # Restores what the migration destroyed: the app previously held a
            # working config/schwab_tokens.json under trading-platform/, and the
            # directory move left it unignored so `git clean -fd` removed it
            # ("Removing trading-platform/config/", run 31928311545).
            #
            # SEED ONLY -- written just once, when the file is absent.
            # The container rotates this file itself: the access token refreshes
            # every 30 minutes and is written back. Overwriting on every deploy
            # would keep reverting it to whatever the secret held, discarding a
            # newer token and eventually breaking auth. So an existing file is
            # always left alone.
            #
            # Once a fresh authorisation is done through the app, this secret is
            # dead weight and should be deleted.
            TOKENS_B64="${{ secrets.SCHWAB_TOKENS_JSON_B64 }}"
            if [ -n "$TOKENS_B64" ]; then
              # Scoped to a subshell for the reason spelled out above: a bare
              # umask here leaks into the checkout and 403s every new asset.
              ( umask 077; printf %s "$TOKENS_B64" | base64 -d > /tmp/incoming_tokens.json )

              # Install when there is nothing there, or when the secret holds a
              # NEWER refresh token than the box does.
              #
              # Newer-wins rather than seed-once. Seed-once was there to stop a
              # redeploy clobbering a token the container had refreshed itself,
              # and that still holds -- a container-refreshed token is newer, so
              # it wins. But it also meant a genuine rotation could not be
              # deployed at all: the file was already present, so a fresh token
              # in the secret was ignored and the box kept running the expiring
              # one until someone deleted the file over SSH.
              #
              # Compared on refresh_token_issued, which is the field the 7-day
              # window runs from.
              issued_of() {
                python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['refresh_token_issued'])" "$1" 2>/dev/null
              }
              NEW_ISSUED=$(issued_of /tmp/incoming_tokens.json)
              OLD_ISSUED=$(issued_of config/schwab_tokens.json)

              if [ -z "$NEW_ISSUED" ]; then
                echo "schwab_tokens: secret did not decode to valid JSON -- leaving the box alone"
              elif [ -z "$OLD_ISSUED" ]; then
                mv /tmp/incoming_tokens.json config/schwab_tokens.json
                chmod 600 config/schwab_tokens.json
                echo "schwab_tokens: installed (none present) -- issued $NEW_ISSUED"
              elif [ "$NEW_ISSUED" \> "$OLD_ISSUED" ]; then
                cp -a config/schwab_tokens.json "config/schwab_tokens.json.replaced-$(date +%Y%m%d-%H%M%S)"
                mv /tmp/incoming_tokens.json config/schwab_tokens.json
                chmod 600 config/schwab_tokens.json
                echo "schwab_tokens: ROTATED $OLD_ISSUED -> $NEW_ISSUED"
              else
                echo "schwab_tokens: box already has $OLD_ISSUED, secret has $NEW_ISSUED -- left alone"
              fi
              rm -f /tmp/incoming_tokens.json
            else
              echo "SCHWAB_TOKENS_JSON_B64 not set -- no token seeded"
            fi

            # This checkout was originally cloned from the previous repository
            # over SSH. Re-point it, idempotently, so the cutover needs no
            # manual session. The URL is deliberately credential-free: nothing
            # durable is written into .git/config.
            WANT="https://github.com/$REPO.git"
            if [ "$(git remote get-url origin)" != "$WANT" ]; then
              echo "re-pointing origin -> $WANT"
              git remote set-url origin "$WANT"
            fi

            # The installation token is supplied through a 0600 credential file
            # that is deleted immediately and again on any exit path. Embedding
            # it in the remote URL instead would persist it in .git/config long
            # after the run, which is exactly what this approach avoids.
            CRED="$(mktemp)"
            trap 'rm -f "$CRED"' EXIT
            chmod 600 "$CRED"
            printf 'https://x-access-token:%s@github.com\n' "$TOKEN" > "$CRED"

            # The leading empty credential.helper clears any inherited helper,
            # so ours is the only one consulted.
            git -c credential.helper= \
                -c credential.helper="store --file=$CRED" \
                fetch --depth 1 origin "$DEPLOY_BRANCH"
            rm -f "$CRED"

            git reset --hard FETCH_HEAD
            git clean -fd -e docker-compose.override.yml
            echo "now at: $(git log --oneline -1)"

            # ---- repair read bits ------------------------------------------
            # Git tracks only the execute bit, so `git reset --hard` will NOT
            # fix a file that is already mode 600 -- it sets modes only on
            # files it creates. Any file checked out by an earlier deploy that
            # ran with the leaked umask (see the Schwab block above) stays
            # unreadable forever, gets COPYed into the image with that mode,
            # and is answered 403 by nginx's worker.
            #
            # Scoped to TRACKED files: config/credentials.yaml and
            # config/schwab_tokens.json are gitignored and must stay 600, so
            # `git ls-files` is what keeps this from widening a secret.
            git ls-files -z | xargs -0 --no-run-if-empty chmod a+r
            find . -type d -not -path './.git*' -not -path './config*' \
                 -exec chmod a+rx {} +
            echo "read bits normalised on $(git ls-files | wc -l) tracked files"

            # ---- one-time cutover: retire the previous project's stack ------
            # Compose derives its project name from the working directory. The
            # migration moved the app from repo/trading-platform up to repo/,
            # so the project changed from "trading-platform" to "repo" and the
            # old containers stopped being visible to --remove-orphans. They
            # kept running, kept port 80, and answered every health check --
            # so the deploy passed while serving the previous build.
            # Idempotent: a no-op once they are gone.
            for c in trading-platform-web-1 trading-platform-api-1; do
              if docker ps -a --format '{{.Names}}' | grep -qx "$c"; then
                echo "retiring legacy container: $c"
                docker rm -f "$c"
              fi
            done

            # ---- disk guard --------------------------------------------------
            # 8 GiB root. Two stacks and their build caches took it to 86%, and
            # a --build needs headroom. Prune only when actually short, so
            # normal deploys keep their cache and stay fast.
            avail_mb=$(df --output=avail -m / | tail -1 | tr -d ' ')
            echo "disk available: ${avail_mb} MiB"
            if [ "$avail_mb" -lt 2048 ]; then
              echo "below 2 GiB free -- pruning build cache"
              docker builder prune -af || true
              docker image prune -af --filter "until=24h" || true
              echo "after prune: $(df --output=avail -m / | tail -1 | tr -d ' ') MiB"
            fi

            # Production settings are passed as variables the tracked compose
            # file reads, rather than living in an untracked override on the
            # box -- that override was stranded by the directory move and is
            # why port 80 was left to the previous stack.
            #
            # AUTOTRADER_COMMIT is a runtime variable, not a build arg. Its
            # value changes every deploy, so compose is forced to recreate the
            # api container each time -- which is what makes /api/version
            # trustworthy: a container that was not recreated by this run
            # cannot be reporting this run's commit.
            # TLS_DOMAIN is DERIVED from the host rather than stored.
            #
            # A certificate authority cannot issue for a bare IP address, which
            # is why this deployment had no HTTPS at all -- and why every first
            # visit cost about 3.5 seconds, because Chrome tries https:// first
            # on a bare IP and waits for that to fail before falling back.
            #
            # sslip.io resolves a-b-c-d.sslip.io to a.b.c.d with no DNS records
            # to manage, so the certificate hostname follows the elastic IP by
            # itself. If EC2_HOST is ever a real domain, the substitution does
            # not match and it passes through unchanged.
            TLS_DOMAIN=$(printf '%s' '${{ secrets.EC2_HOST }}' | tr '.' '-').sslip.io
            case '${{ secrets.EC2_HOST }}' in
              *[!0-9.]*) TLS_DOMAIN='${{ secrets.EC2_HOST }}' ;;   # already a hostname
            esac
            echo "TLS hostname: $TLS_DOMAIN"

            # OAuth sign-in. Each of these is unset until the matching repo
            # secret exists, and unset means that provider reports itself as
            # unconfigured and its button says so -- the deploy still succeeds.
            #
            # AUTOTRADER_PUBLIC_BASE_URL must equal the origin registered as the
            # redirect URI at each provider, character for character. It follows
            # $TLS_DOMAIN by default, which follows the elastic IP: if that IP
            # ever changes, TLS_DOMAIN changes with it and every registered
            # redirect URI stops matching until they are re-registered. Set the
            # OAUTH_PUBLIC_BASE_URL secret to a stable custom domain to break
            # that dependency.
            OAUTH_BASE="${{ secrets.OAUTH_PUBLIC_BASE_URL }}"
            [ -n "$OAUTH_BASE" ] || OAUTH_BASE="https://$TLS_DOMAIN"
            echo "OAuth redirect base: $OAUTH_BASE"

            WEB_PORT=80 \
            TLS_PORT=443 \
            TLS_DOMAIN="$TLS_DOMAIN" \
            AUTOTRADER_CORS_ORIGINS="http://${{ secrets.EC2_HOST }},https://$TLS_DOMAIN" \
            AUTOTRADER_COMMIT="${{ github.sha }}" \
            AUTOTRADER_PUBLIC_BASE_URL="$OAUTH_BASE" \
            AUTOTRADER_GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
            AUTOTRADER_GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            AUTOTRADER_LINKEDIN_CLIENT_ID="${{ secrets.LINKEDIN_CLIENT_ID }}" \
            AUTOTRADER_LINKEDIN_CLIENT_SECRET="${{ secrets.LINKEDIN_CLIENT_SECRET }}" \
            AUTOTRADER_TWITTER_CLIENT_ID="${{ secrets.TWITTER_CLIENT_ID }}" \
            AUTOTRADER_TWITTER_CLIENT_SECRET="${{ secrets.TWITTER_CLIENT_SECRET }}" \
            docker compose up --build -d --remove-orphans

            docker image prune -f          # t3.micro has an 8 GiB disk

            echo "---- listening after deploy ----"
            docker ps --format '  {{.Names}}  {{.Status}}  {{.Ports}}'

            # Certificate issuance is best-effort and must never fail a deploy:
            # the site serves over HTTP either way. But without this the only
            # symptom of a broken certbot is "https does not answer", with no
            # way to see why short of getting on the box.
            echo "---- certbot ----"
            sleep 25
            docker compose logs --tail 25 certbot 2>&1 | sed 's/^/  /' || true
            if docker compose exec -T certbot test -f \
                 "/etc/letsencrypt/live/$TLS_DOMAIN/fullchain.pem" 2>/dev/null; then
              echo "  certificate present for $TLS_DOMAIN"
            else
              echo "  no certificate yet -- site stays on HTTP, certbot retries"
            fi
          REMOTE

      - name: Wait for the API to report healthy
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                   "http://${{ secrets.EC2_HOST }}/api/health" || true)
            if [ "$code" = "200" ]; then echo "healthy after $((i*5))s"; exit 0; fi
            sleep 5
          done
          echo "API did not become healthy"; exit 1

      # THE CHECK THAT MATTERS. Everything above this point can pass against a
      # stale container: a leftover stack from an earlier project name kept
      # port 80 through an entire deploy, so /api/health returned 200, the
      # dashboard served <title>AutoTrader</title>, and /api/strategies listed
      # rsi_divergence -- all from the previous build. Nothing in that set can
      # tell two builds of the same app apart.
      #
      # The commit is baked into the image at build time, so this assertion
      # fails unless the container answering on port 80 is the one this run
      # just built.
      - name: Verify the deployed commit is the one we just built
        run: |
          set -e
          body=$(curl -fsS --max-time 20 "http://${{ secrets.EC2_HOST }}/api/version")
          echo "  /api/version -> $body"
          served=$(printf '%s' "$body" | sed -n 's/.*"commit"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
          if [ -z "$served" ]; then
            echo "  FAIL: /api/version reported no commit field."
            echo "        The container on port 80 predates this check, which"
            echo "        means it is not the build this run produced."
            exit 1
          fi
          if [ "$served" != "${{ github.sha }}" ]; then
            echo "  FAIL: port 80 is served by a different build."
            echo "        expected ${{ github.sha }}"
            echo "        serving  $served"
            exit 1
          fi
          echo "  CONFIRMED: port 80 is served by ${{ github.sha }}"

      - name: Smoke test the deployed app
        run: |
          set -e
          # -L because port 80 now redirects to the certificate's hostname once
          # a certificate exists. Without it this check receives the 301, finds
          # no <title> in an empty body, and fails a deploy that is perfectly
          # healthy. Following the redirect also proves the HTTPS side serves.
          curl -fsSL --max-time 30 "http://${{ secrets.EC2_HOST }}/" | grep -q '<title>AutoTrader</title>'
          echo "  dashboard served"

          # /api/strategies is PROTECTED. This check used to read its body and
          # grep for a strategy id, which stopped being possible the moment the
          # app went behind a login -- an anonymous caller now gets 401, which
          # is the whole point, and the deploy failed on the app working
          # correctly. Asserting the 401 is the stronger check anyway: it
          # proves the API is up AND that the guard is live.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
                 "http://${{ secrets.EC2_HOST }}/api/strategies")
          [ "$code" = "401" ] || { echo "  /api/strategies answered $code, expected 401"; exit 1; }
          echo "  API up and refusing anonymous callers (401)"

          # The sign-in page must actually be served. It lives in web/public/
          # and reaches the image through Vite's dist/. This catches both a
          # missing page and one the box made unreadable (403).
          curl -fsSL --max-time 30 "http://${{ secrets.EC2_HOST }}/autotrader_signin.html" \
            | grep -q 'AutoTrader' \
            || { echo "  sign-in page not served"; exit 1; }
          echo "  sign-in page served"

          # The OAuth provider list must answer without a session -- it is what
          # tells the sign-in page which buttons can do anything.
          curl -fsS --max-time 20 "http://${{ secrets.EC2_HOST }}/api/auth/oauth/providers" \
            | grep -q '"google"'
          echo "  OAuth provider list reachable signed-out"

      - name: Close SSH again
        if: always()          # runs even when an earlier step fails
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.EC2_SG_ID }}" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${{ steps.ip.outputs.addr }}/32}]" \
            || echo "rule already gone"
