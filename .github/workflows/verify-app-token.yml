name: Verify GitHub App token (temporary)

# Proves, rather than assumes, that:
#   1. the org-level APP_ID / APP_PRIVATE_KEY are readable from THIS repo
#   2. a valid installation access token can be minted from them
#   3. the installation actually includes wealthwise-advisors/trading-platform
#   4. the token carries contents:read, which is what `git fetch` needs
#   5. a real git fetch over HTTPS with that token succeeds
#
# Runs on the migration branch because workflow_dispatch only lists workflows
# present on the default branch. Deleted once the cutover is verified.
#
# The token is never printed. actions/create-github-app-token registers it as
# a masked secret, and every check below reports metadata only.

on:
  push:
    branches: [migrate/current-autotrader]
    paths: ['.github/workflows/verify-app-token.yml']
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Report which credentials are actually visible
        env:
          SEEN_APP_ID: ${{ secrets.APP_ID }}
          SEEN_APP_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          # Report both independently -- do not exit on the first gap, or a
          # single missing value hides the state of everything after it.
          if [ -n "$SEEN_APP_ID" ]; then
            echo "  secrets.APP_ID:          present (${#SEEN_APP_ID} chars)"
          else
            echo "  secrets.APP_ID:          ABSENT -- falling back to the literal App ID"
            echo "                           (an App ID is a public identifier, not a secret)"
          fi
          if [ -n "$SEEN_APP_KEY" ]; then
            echo "  secrets.APP_PRIVATE_KEY: present (${#SEEN_APP_KEY} chars, value withheld)"
          else
            echo "  secrets.APP_PRIVATE_KEY: ABSENT -- cannot continue, this one IS a secret"
            exit 1
          fi

      - name: Mint an installation access token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          # Prefer the secret if it exists; otherwise use the App's public ID.
          # An empty expression is falsy in GitHub expressions, so this selects
          # the literal only when the secret is genuinely unset.
          app-id: ${{ secrets.APP_ID || '4607282' }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Which repositories does this installation cover?
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "token minted: ${#GH_TOKEN} characters (value withheld)"
          echo
          echo "===== repositories in this installation ====="
          gh api /installation/repositories --paginate \
            --jq '.repositories[] | "  \(.full_name)"' | sort | tee /tmp/repos.txt
          echo
          if grep -qx "  ${{ github.repository }}" /tmp/repos.txt; then
            echo "  OK -- ${{ github.repository }} IS in the installation"
          else
            echo "  FAIL -- ${{ github.repository }} is NOT in the installation"
            echo "  Fix: org Settings -> GitHub Apps -> configure -> Repository access"
            exit 1
          fi

      - name: Does the token carry contents:read?
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "===== permissions granted to this token ====="
          # The installation endpoint reports the permission set for the app.
          gh api /installation/repositories --jq '.repositories[0].permissions' 2>/dev/null \
            | sed 's/^/  /' || echo "  (per-repo permission block not exposed; the fetch below is the real test)"
          echo
          echo "===== can it actually read this repo's metadata? ====="
          gh api "repos/${{ github.repository }}" \
            --jq '"  \(.full_name)  private=\(.private)  default_branch=\(.default_branch)"'

      - name: The decisive test -- a real git fetch over HTTPS
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "===== git ls-remote using the installation token ====="
          # This is exactly the credential form the deploy step will use.
          if git ls-remote --heads \
               "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
               2>/tmp/err.txt | sed 's/^/  /'; then
            echo "  OK -- the token authenticates for git operations"
          else
            echo "  FAIL -- git could not authenticate"
            sed 's/^/  /' /tmp/err.txt
            exit 1
          fi

          echo
          echo "===== shallow fetch, as the server will do it ====="
          rm -rf /tmp/probe && mkdir -p /tmp/probe && cd /tmp/probe && git init -q
          git fetch --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            "${{ github.ref_name }}" 2>&1 | sed 's/^/  /'
          echo "  fetched: $(git log --oneline -1 FETCH_HEAD)"

      - name: Confirm the token expires
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Short-lived credentials are the point of this approach; show it is true.
          exp=$(gh api -i /installation/repositories 2>/dev/null | grep -i '^github-authentication-token-expiration' || true)
          echo "  ${exp:-expiration header not returned by this endpoint}"
