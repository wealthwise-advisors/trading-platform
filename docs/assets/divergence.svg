Font,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20.6" fill="#eaf3ff">Close takes the trigger</text></g><text x="34" y="416" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18.4" fill="#8ba1bc">The divergence only ARMS the setup. Several bars can pass before the</text><text x="34" y="440" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18.4" fill="#8ba1bc">trigger is taken — which is why every timeframe needs its own strategy instance.</text></svg>