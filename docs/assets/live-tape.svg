<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img" aria-label="Live Replay: candles arrive on their own as the market prints them, roughly fifteen seconds after each bar closes">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0b1626"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="vwapline" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="1120" y2="0">
      <stop offset="0%"   stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="lglow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="tgrid" width="48" height="40" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 40" fill="none" stroke="#111e2f" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="280" fill="url(#tbg)"/>
  <rect width="1280" height="280" fill="url(#tgrid)" opacity=".55"/>
  <rect width="1280" height="280" fill="none" stroke="#1c2b40"/>

  <!-- ── VWAP and its bands, drawing themselves once per cycle ─────────────── -->
  <g fill="none">
    <path pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"
          d="M 60 168 C 220 156, 380 164, 540 146 S 860 136, 1120 124"
          stroke="url(#vwapline)" stroke-width="2.5">
      <animate attributeName="stroke-dashoffset" values="100;0;0" keyTimes="0;.18;1"
               dur="9s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.4 0 0.2 1;0 0 1 1"/>
    </path>
    <path d="M 60 128 C 220 116, 380 124, 540 106 S 860 96, 1120 84"
          stroke="#8b5cf6" stroke-width="1.2" stroke-dasharray="4 6" opacity="0">
      <animate attributeName="opacity" values="0;0;.32;.32" keyTimes="0;.10;.28;1"
               dur="9s" repeatCount="indefinite" calcMode="spline"
               keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1"/>
    </path>
    <path d="M 60 208 C 220 196, 380 204, 540 186 S 860 176, 1120 164"
          stroke="#8b5cf6" stroke-width="1.2" stroke-dasharray="4 6" opacity="0">
      <animate attributeName="opacity" values="0;0;.32;.32" keyTimes="0;.10;.28;1"
               dur="9s" repeatCount="indefinite" calcMode="spline"
               keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1"/>
    </path>
  </g>
  <text x="1132" y="128" font-family="ui-monospace,monospace" font-size="11" fill="#a78bfa" opacity=".85">VWAP</text>
  <text x="1132" y="88" font-family="ui-monospace,monospace" font-size="10" fill="#8b5cf6" opacity=".45">+2σ</text>
  <text x="1132" y="168" font-family="ui-monospace,monospace" font-size="10" fill="#8b5cf6" opacity=".45">−2σ</text>

  <!-- ── settled candles ───────────────────────────────────────────────────── -->
  <g stroke-width="2.5" stroke-linecap="round">
    <g stroke="#22c55e" fill="#22c55e">
      <line x1="96"  y1="168" x2="96"  y2="202"/><rect x="90"  y="174" width="12" height="21" rx="1.5"/>
      <line x1="156" y1="160" x2="156" y2="196"/><rect x="150" y="167" width="12" height="22" rx="1.5"/>
      <line x1="276" y1="158" x2="276" y2="194"/><rect x="270" y="165" width="12" height="21" rx="1.5"/>
      <line x1="336" y1="150" x2="336" y2="188"/><rect x="330" y="158" width="12" height="23" rx="1.5"/>
      <line x1="456" y1="144" x2="456" y2="180"/><rect x="450" y="151" width="12" height="22" rx="1.5"/>
      <line x1="576" y1="134" x2="576" y2="170"/><rect x="570" y="141" width="12" height="22" rx="1.5"/>
      <line x1="636" y1="128" x2="636" y2="166"/><rect x="630" y="136" width="12" height="23" rx="1.5"/>
      <line x1="756" y1="122" x2="756" y2="158"/><rect x="750" y="129" width="12" height="22" rx="1.5"/>
    </g>
    <g stroke="#f43f5e" fill="#f43f5e">
      <line x1="216" y1="154" x2="216" y2="192"/><rect x="210" y="162" width="12" height="22" rx="1.5"/>
      <line x1="396" y1="146" x2="396" y2="184"/><rect x="390" y="154" width="12" height="22" rx="1.5"/>
      <line x1="516" y1="138" x2="516" y2="176"/><rect x="510" y="146" width="12" height="22" rx="1.5"/>
      <line x1="696" y1="126" x2="696" y2="164"/><rect x="690" y="134" width="12" height="22" rx="1.5"/>
    </g>
  </g>

  <!-- ── candles that ARRIVE: each grows from its own midpoint, then flashes ── -->
  <!-- transform-origin is not reliable across renderers, so the scale is wrapped
       in a translate to the candle's centre and back. -->
  <g stroke-width="2.5" stroke-linecap="round">

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.26;.30;.96;1" dur="9s" repeatCount="indefinite"/>
      <g transform="translate(816,116)">
        <g>
          <animateTransform attributeName="transform" type="scale" values="1 0;1 1.18;1 1"
                            keyTimes="0;.30;.34" dur="9s" repeatCount="indefinite"
                            calcMode="spline" keySplines="0.2 0.8 0.3 1;0.5 0 0.3 1" additive="sum"/>
          <g transform="translate(-816,-116)" stroke="#22c55e" fill="#22c55e">
            <line x1="816" y1="98" x2="816" y2="134"/><rect x="810" y="105" width="12" height="22" rx="1.5"/>
          </g>
        </g>
      </g>
      <circle cx="816" cy="116" r="16" fill="none" stroke="#22c55e" stroke-width="2" opacity="0">
        <animate attributeName="r" values="10;30" keyTimes="0;.36" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.8;0" keyTimes="0;.30;.36" dur="9s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.44;.48;.96;1" dur="9s" repeatCount="indefinite"/>
      <g transform="translate(876,110)">
        <g>
          <animateTransform attributeName="transform" type="scale" values="1 0;1 1.18;1 1"
                            keyTimes="0;.48;.52" dur="9s" repeatCount="indefinite"
                            calcMode="spline" keySplines="0.2 0.8 0.3 1;0.5 0 0.3 1" additive="sum"/>
          <g transform="translate(-876,-110)" stroke="#22c55e" fill="#22c55e">
            <line x1="876" y1="92" x2="876" y2="128"/><rect x="870" y="99" width="12" height="22" rx="1.5"/>
          </g>
        </g>
      </g>
      <circle cx="876" cy="110" r="16" fill="none" stroke="#22c55e" stroke-width="2" opacity="0">
        <animate attributeName="r" values="10;30" keyTimes="0;.54" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.8;0" keyTimes="0;.48;.54" dur="9s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.62;.66;.96;1" dur="9s" repeatCount="indefinite"/>
      <g transform="translate(936,114)">
        <g>
          <animateTransform attributeName="transform" type="scale" values="1 0;1 1.18;1 1"
                            keyTimes="0;.66;.70" dur="9s" repeatCount="indefinite"
                            calcMode="spline" keySplines="0.2 0.8 0.3 1;0.5 0 0.3 1" additive="sum"/>
          <g transform="translate(-936,-114)" stroke="#f43f5e" fill="#f43f5e">
            <line x1="936" y1="96" x2="936" y2="132"/><rect x="930" y="104" width="12" height="21" rx="1.5"/>
          </g>
        </g>
      </g>
      <circle cx="936" cy="114" r="16" fill="none" stroke="#f43f5e" stroke-width="2" opacity="0">
        <animate attributeName="r" values="10;30" keyTimes="0;.72" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.8;0" keyTimes="0;.66;.72" dur="9s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.80;.84;.96;1" dur="9s" repeatCount="indefinite"/>
      <g transform="translate(996,104)">
        <g>
          <animateTransform attributeName="transform" type="scale" values="1 0;1 1.18;1 1"
                            keyTimes="0;.84;.88" dur="9s" repeatCount="indefinite"
                            calcMode="spline" keySplines="0.2 0.8 0.3 1;0.5 0 0.3 1" additive="sum"/>
          <g transform="translate(-996,-104)" stroke="#22c55e" fill="#22c55e">
            <line x1="996" y1="86" x2="996" y2="122"/><rect x="990" y="93" width="12" height="22" rx="1.5"/>
          </g>
        </g>
      </g>
      <circle cx="996" cy="104" r="16" fill="none" stroke="#22c55e" stroke-width="2" opacity="0">
        <animate attributeName="r" values="10;30" keyTimes="0;.90" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.8;0" keyTimes="0;.84;.90" dur="9s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- the forming bar: present, breathing, never presented as closed -->
  <g opacity=".42">
    <line x1="1056" y1="84" x2="1056" y2="118" stroke="#7b93ad" stroke-width="2" stroke-dasharray="3 3"/>
    <rect x="1050" y="92" width="12" height="16" rx="1.5" fill="none" stroke="#7b93ad"
          stroke-width="2" stroke-dasharray="3 3">
      <animate attributeName="height" values="10;19;12;17;10" dur="2.8s" repeatCount="indefinite"
               calcMode="spline" keyTimes="0;.25;.5;.75;1"
               keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
    </rect>
    <text x="1056" y="140" text-anchor="middle" font-family="ui-monospace,monospace"
          font-size="10" fill="#7b93ad">forming</text>
  </g>

  <!-- ── LIVE badge ────────────────────────────────────────────────────────── -->
  <g filter="url(#lglow)">
    <circle cx="76" cy="42" r="6" fill="#22c55e">
      <animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"
               calcMode="spline" keyTimes="0;.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="r" values="6;7.5;6" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="92" y="47" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14"
        fill="#22c55e" font-weight="700" letter-spacing="1.5">FOLLOWING LIVE</text>
  <text x="236" y="47" font-family="ui-monospace,monospace" font-size="12.5" fill="#5f7994">
    new bars arrive on their own — no reload, no clicking
  </text>

  <!-- status line, cycling exactly as the app's does -->
  <g font-family="ui-monospace,monospace" font-size="13">
    <text x="76" y="248" fill="#8ba3bd" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.26;.30;1" dur="9s" repeatCount="indefinite"/>
      the newest bar is still forming (1 withheld)
    </text>
    <text x="76" y="248" fill="#2dd4bf" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.30;.34;.60;.64;1" dur="9s" repeatCount="indefinite"/>
      1 new bar, now at 15:56 — VWAP and bands updated
    </text>
    <text x="76" y="248" fill="#8ba3bd" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.64;.68;.96;1" dur="9s" repeatCount="indefinite"/>
      1 min behind the clock — the current bar is still forming
    </text>
  </g>

  <line x1="60" y1="226" x2="1220" y2="226" stroke="#1c2b40"/>
</svg>
