<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="260" viewBox="0 0 1280 260" role="img" aria-label="Live Replay: candles arrive on their own as the market prints them, roughly fifteen seconds after each bar closes">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0b1424"/>
      <stop offset="100%" stop-color="#070c16"/>
    </linearGradient>
    <filter id="softglow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="260" fill="url(#tbg)"/>
  <rect width="1280" height="260" fill="none" stroke="#1e293b"/>

  <!-- VWAP band, drawn first so candles sit over it -->
  <path d="M 60 150 C 220 138, 380 146, 540 128 S 860 118, 1100 108"
        fill="none" stroke="#a78bfa" stroke-width="2" opacity=".55"/>
  <path d="M 60 112 C 220 100, 380 108, 540 90 S 860 80, 1100 70"
        fill="none" stroke="#a78bfa" stroke-width="1" opacity=".22" stroke-dasharray="5 5"/>
  <path d="M 60 188 C 220 176, 380 184, 540 166 S 860 156, 1100 146"
        fill="none" stroke="#a78bfa" stroke-width="1" opacity=".22" stroke-dasharray="5 5"/>
  <text x="1112" y="112" font-family="ui-monospace,monospace" font-size="11" fill="#a78bfa" opacity=".8">VWAP</text>

  <!-- ── settled candles ─────────────────────────────────────────────────── -->
  <g stroke-width="2">
    <g stroke="#22c55e" fill="#22c55e">
      <line x1="90"  y1="150" x2="90"  y2="182"/><rect x="84"  y="156" width="12" height="20" rx="1"/>
      <line x1="150" y1="142" x2="150" y2="176"/><rect x="144" y="148" width="12" height="22" rx="1"/>
      <line x1="270" y1="140" x2="270" y2="174"/><rect x="264" y="146" width="12" height="21" rx="1"/>
      <line x1="330" y1="132" x2="330" y2="168"/><rect x="324" y="139" width="12" height="23" rx="1"/>
      <line x1="450" y1="126" x2="450" y2="160"/><rect x="444" y="132" width="12" height="22" rx="1"/>
      <line x1="570" y1="116" x2="570" y2="150"/><rect x="564" y="122" width="12" height="22" rx="1"/>
      <line x1="630" y1="110" x2="630" y2="146"/><rect x="624" y="117" width="12" height="23" rx="1"/>
      <line x1="750" y1="104" x2="750" y2="138"/><rect x="744" y="110" width="12" height="22" rx="1"/>
    </g>
    <g stroke="#f43f5e" fill="#f43f5e">
      <line x1="210" y1="136" x2="210" y2="172"/><rect x="204" y="143" width="12" height="22" rx="1"/>
      <line x1="390" y1="128" x2="390" y2="164"/><rect x="384" y="135" width="12" height="22" rx="1"/>
      <line x1="510" y1="120" x2="510" y2="156"/><rect x="504" y="127" width="12" height="22" rx="1"/>
      <line x1="690" y1="108" x2="690" y2="144"/><rect x="684" y="115" width="12" height="22" rx="1"/>
    </g>
  </g>

  <!-- ── candles that ARRIVE, one after another, then reset ──────────────── -->
  <!-- This is the whole point of the graphic: nobody clicks anything. -->
  <g stroke-width="2">
    <g stroke="#22c55e" fill="#22c55e" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;.24;.30;.94;.97;1" dur="9s" repeatCount="indefinite"/>
      <line x1="810" y1="98" x2="810" y2="132"/><rect x="804" y="104" width="12" height="22" rx="1"/>
    </g>
    <g stroke="#22c55e" fill="#22c55e" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;.42;.48;.94;.97;1" dur="9s" repeatCount="indefinite"/>
      <line x1="870" y1="92" x2="870" y2="126"/><rect x="864" y="98" width="12" height="22" rx="1"/>
    </g>
    <g stroke="#f43f5e" fill="#f43f5e" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;.60;.66;.94;.97;1" dur="9s" repeatCount="indefinite"/>
      <line x1="930" y1="96" x2="930" y2="130"/><rect x="924" y="102" width="12" height="21" rx="1"/>
    </g>
    <g stroke="#22c55e" fill="#22c55e" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;.78;.84;.94;.97;1" dur="9s" repeatCount="indefinite"/>
      <line x1="990" y1="86" x2="990" y2="120"/><rect x="984" y="92" width="12" height="22" rx="1"/>
    </g>
  </g>

  <!-- the forming bar: present but visibly unfinished, never "closed" -->
  <g opacity=".38">
    <line x1="1050" y1="84" x2="1050" y2="114" stroke="#64748b" stroke-width="2" stroke-dasharray="3 3"/>
    <rect x="1044" y="90" width="12" height="16" rx="1" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="3 3">
      <animate attributeName="height" values="10;18;12;16;10" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <text x="1050" y="132" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#64748b">forming</text>
  </g>

  <!-- ── LIVE badge ──────────────────────────────────────────────────────── -->
  <g filter="url(#softglow)">
    <circle cx="76" cy="40" r="6" fill="#22c55e">
      <animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="92" y="45" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14"
        fill="#22c55e" font-weight="700" letter-spacing="1.5">FOLLOWING LIVE</text>
  <text x="232" y="45" font-family="ui-monospace,monospace" font-size="13" fill="#64748b">
    new bars arrive on their own — no reload, no clicking
  </text>

  <!-- status line, cycling exactly as the app's does -->
  <g font-family="ui-monospace,monospace" font-size="13">
    <text x="76" y="228" fill="#94a3b8" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.28;.32;1" dur="9s" repeatCount="indefinite"/>
      the newest bar is still forming (1 withheld)
    </text>
    <text x="76" y="228" fill="#2dd4bf" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.32;.36;.60;.64;1" dur="9s" repeatCount="indefinite"/>
      1 new bar, now at 15:56 — VWAP and bands updated
    </text>
    <text x="76" y="228" fill="#94a3b8" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.64;.68;.96;1" dur="9s" repeatCount="indefinite"/>
      1 min behind the clock — the current bar is still forming
    </text>
  </g>

  <line x1="60" y1="206" x2="1220" y2="206" stroke="#1e293b"/>
</svg>
