<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="AutoTrader — Algorithmic Trading Research and Execution Platform, built at WealthWise Advisors">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#070c16"/>
      <stop offset="45%"  stop-color="#0c1a2e"/>
      <stop offset="100%" stop-color="#160f2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#38bdf8"/>
      <stop offset="45%"  stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#38bdf8"/>
      <stop offset="50%"  stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="62%"  stop-color="#dbe4ee"/>
      <stop offset="100%" stop-color="#9fb0c6"/>
    </linearGradient>
    <linearGradient id="equity" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2dd4bf" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#2dd4bf" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#a78bfa" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#182136" stroke-width="1" opacity=".6"/>
    </pattern>
    <!-- The equity curve climbs left-to-right straight through the pipeline
         line, so the tail of it competed with the curve for legibility. This
         fades the ground under the wordmark without hiding the chart. -->
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#070c16" stop-opacity=".92"/>
      <stop offset="52%"  stop-color="#070c16" stop-opacity=".82"/>
      <stop offset="78%"  stop-color="#070c16" stop-opacity=".40"/>
      <stop offset="100%" stop-color="#070c16" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <ellipse cx="980" cy="140" rx="420" ry="220" fill="url(#glow)"/>
  <ellipse cx="240" cy="300" rx="360" ry="200" fill="url(#glow2)"/>

  <!-- equity curve -->
  <g transform="translate(0,34)">
    <path d="M0 286 L64 272 L128 292 L192 250 L256 264 L320 224 L384 240 L448 198
             L512 214 L576 172 L640 190 L704 148 L768 164 L832 122 L896 138 L960 100
             L1024 116 L1088 78 L1152 92 L1216 56 L1280 68 L1280 366 L0 366 Z"
          fill="url(#equity)"/>
    <path d="M0 286 L64 272 L128 292 L192 250 L256 264 L320 224 L384 240 L448 198
             L512 214 L576 172 L640 190 L704 148 L768 164 L832 122 L896 138 L960 100
             L1024 116 L1088 78 L1152 92 L1216 56 L1280 68"
          fill="none" stroke="url(#accent)" stroke-width="2.6"
          stroke-linejoin="round" stroke-linecap="round"
          stroke-dasharray="2100" stroke-dashoffset="2100">
      <animate attributeName="stroke-dashoffset" from="2100" to="0"
               dur="2.2s" begin="0s" fill="freeze"
               calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1"/>
    </path>
    <g fill="#070c16" stroke="#2dd4bf" stroke-width="2.4">
      <circle cx="320" cy="224" r="5" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur=".4s" begin="0.7s" fill="freeze"/></circle>
      <circle cx="576" cy="172" r="5" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur=".4s" begin="1.1s" fill="freeze"/></circle>
      <circle cx="832" cy="122" r="5" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur=".4s" begin="1.5s" fill="freeze"/></circle>
      <circle cx="1088" cy="78" r="5" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur=".4s" begin="1.9s" fill="freeze"/></circle>
    </g>
  </g>

  <!-- candlesticks -->
  <g opacity=".85" stroke-width="2">
    <g stroke="#22c55e" fill="#22c55e">
      <rect x="1002" y="222" width="9" height="36" rx="1.5"/><path d="M1006.5 211v11M1006.5 258v11"/>
      <rect x="1062" y="200" width="9" height="31" rx="1.5"/><path d="M1066.5 189v11M1066.5 231v11"/>
      <rect x="1152" y="172" width="9" height="40" rx="1.5"/><path d="M1156.5 161v11M1156.5 212v11"/>
    </g>
    <g stroke="#f43f5e" fill="#f43f5e">
      <rect x="1032" y="211" width="9" height="27" rx="1.5"/><path d="M1036.5 200v11M1036.5 238v11"/>
      <rect x="1092" y="190" width="9" height="31" rx="1.5"/><path d="M1096.5 179v11M1096.5 221v11"/>
      <rect x="1122" y="197" width="9" height="25" rx="1.5"/><path d="M1126.5 186v11M1126.5 222v11"/>
    </g>
  </g>

  <!-- full height on purpose: a boxed scrim leaves a visible horizontal seam
       where it ends, so only the right-hand fade should be perceptible. -->
  <rect x="0" y="0" width="880" height="394" fill="url(#scrim)"/>

  <!-- wordmark: AUTOTRADER is the product, WealthWise Advisors is the company -->
  <g transform="translate(72,62)">
    <rect x="0" y="0" width="5" height="172" rx="2.5" fill="url(#rail)"/>

    <!-- company, secondary -->
    <text x="26" y="20" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5"
          font-weight="700" letter-spacing="5.4" fill="#5eead4">WEALTHWISE ADVISORS</text>

    <!-- product, dominant -->
    <text x="24" y="92" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="68"
          font-weight="800" letter-spacing="-1.4" fill="url(#title)">AutoTrader</text>

    <!-- what it is -->
    <text x="26" y="126" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18.5"
          font-weight="600" letter-spacing=".3" fill="#c3cfdf">Algorithmic Trading Research &amp; Execution Platform</text>

    <!-- the pipeline -->
    <text x="26" y="163" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5"
          font-weight="500" letter-spacing=".9" fill="#8d9cb2">Market&#160;Data<tspan fill="#38bdf8" font-weight="700"> → </tspan>Intelligence<tspan fill="#22d3ee" font-weight="700"> → </tspan>Strategy<tspan fill="#2dd4bf" font-weight="700"> → </tspan>Simulation<tspan fill="#818cf8" font-weight="700"> → </tspan>Execution<tspan fill="#a78bfa" font-weight="700"> → </tspan>Analytics</text>
  </g>

  <!-- stat strip -->
  <rect x="48" y="286" width="742" height="66" rx="12" fill="#070c16" opacity=".78"/>
  <rect x="48" y="286" width="742" height="66" rx="12" fill="none" stroke="#1d2a40" stroke-width="1"/>
  <g transform="translate(80,322)" font-family="Segoe UI,Helvetica,Arial,sans-serif">
    <g fill="#eef3f9" font-size="21" font-weight="700">
      <text x="0"   y="0">1,315</text>
      <text x="142" y="0">21.5k</text>
      <text x="284" y="0">5</text>
      <text x="426" y="0">8</text>
      <text x="568" y="0">11</text>
    </g>
    <g fill="#75859c" font-size="10.5" letter-spacing="1.5">
      <text x="0"   y="19">TESTS</text>
      <text x="142" y="19">LINES OF CODE</text>
      <text x="284" y="19">STRATEGIES</text>
      <text x="426" y="19">WAVE STRUCTURES</text>
      <text x="568" y="19">TIMEFRAMES</text>
    </g>
    <g stroke="#1f2c42" stroke-width="1">
      <path d="M120 -18v36"/><path d="M262 -18v36"/><path d="M404 -18v36"/><path d="M546 -18v36"/>
    </g>
  </g>

  <rect y="394" width="1280" height="6" fill="url(#accent)"/>
</svg>
