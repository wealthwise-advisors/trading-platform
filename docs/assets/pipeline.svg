<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="230" viewBox="0 0 1280 230" role="img" aria-label="AutoTrader pipeline: market data flows through resampling, analysis, strategy and the paper broker to a scored result">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#070c16"/>
      <stop offset="55%"  stop-color="#0b1424"/>
      <stop offset="100%" stop-color="#070c16"/>
    </linearGradient>
    <!-- userSpaceOnUse, not the default objectBoundingBox: a horizontal <line> has
         a zero-height bounding box, which makes a bounding-box gradient degenerate
         and the stroke invisible. Caught by rendering it. -->
    <linearGradient id="wire" gradientUnits="userSpaceOnUse" x1="118" y1="0" x2="1162" y2="0">
      <stop offset="0%"   stop-color="#38bdf8"/>
      <stop offset="50%"  stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- The path the data travels. Referenced by every moving element. -->
    <path id="flow" d="M 118 115 H 1162"/>
  </defs>

  <rect width="1280" height="230" fill="url(#pbg)"/>
  <rect width="1280" height="230" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- the wire -->
  <line x1="118" y1="115" x2="1162" y2="115" stroke="url(#wire)" stroke-width="2" opacity=".45"/>
  <line x1="118" y1="115" x2="1162" y2="115" stroke="url(#wire)" stroke-width="2"
        stroke-dasharray="10 14" opacity=".8">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.1s" repeatCount="indefinite"/>
  </line>

  <!-- three packets travelling the wire, staggered -->
  <g filter="url(#glow)">
    <circle r="6" fill="#2dd4bf">
      <animateMotion dur="4.2s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
        <mpath href="#flow"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.06;.94;1" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#38bdf8">
      <animateMotion dur="4.2s" begin="1.4s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
        <mpath href="#flow"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.06;.94;1" dur="4.2s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#a78bfa">
      <animateMotion dur="4.2s" begin="2.8s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
        <mpath href="#flow"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.06;.94;1" dur="4.2s" begin="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ── stages ───────────────────────────────────────────────────────────── -->
  <!-- Each pulses as a packet reaches it: begin times are spaced across the 4.2s
       cycle in the same proportion as the node's position along the wire. -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">

    <g>
      <circle cx="118" cy="115" r="30" fill="#0f1c2e" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="118" cy="115" r="30" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0">
        <animate attributeName="r" values="30;44" dur="4.2s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".7;0" dur="4.2s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <text x="118" y="121" font-size="20" fill="#38bdf8">⬇</text>
      <text x="118" y="176" font-size="13" fill="#e2e8f0" font-weight="600">Market Data</text>
      <text x="118" y="194" font-size="11" fill="#64748b">Schwab · CSV</text>
    </g>

    <g>
      <circle cx="327" cy="115" r="26" fill="#0f1c2e" stroke="#2dd4bf" stroke-width="2"/>
      <circle cx="327" cy="115" r="26" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0">
        <animate attributeName="r" values="26;40" dur="4.2s" begin=".84s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".7;0" dur="4.2s" begin=".84s" repeatCount="indefinite"/>
      </circle>
      <text x="327" y="121" font-size="17" fill="#2dd4bf">⧉</text>
      <text x="327" y="176" font-size="13" fill="#e2e8f0" font-weight="600">Resample</text>
      <text x="327" y="194" font-size="11" fill="#64748b">one aggregator</text>
    </g>

    <g>
      <circle cx="536" cy="115" r="26" fill="#0f1c2e" stroke="#2dd4bf" stroke-width="2"/>
      <circle cx="536" cy="115" r="26" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0">
        <animate attributeName="r" values="26;40" dur="4.2s" begin="1.68s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".7;0" dur="4.2s" begin="1.68s" repeatCount="indefinite"/>
      </circle>
      <text x="536" y="122" font-size="17" fill="#2dd4bf">🌊</text>
      <text x="536" y="176" font-size="13" fill="#e2e8f0" font-weight="600">Analysis</text>
      <text x="536" y="194" font-size="11" fill="#64748b">waves · VWAP</text>
    </g>

    <g>
      <circle cx="745" cy="115" r="26" fill="#0f1c2e" stroke="#a78bfa" stroke-width="2"/>
      <circle cx="745" cy="115" r="26" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0">
        <animate attributeName="r" values="26;40" dur="4.2s" begin="2.52s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".7;0" dur="4.2s" begin="2.52s" repeatCount="indefinite"/>
      </circle>
      <text x="745" y="121" font-size="17" fill="#a78bfa">⚡</text>
      <text x="745" y="176" font-size="13" fill="#e2e8f0" font-weight="600">Strategy</text>
      <text x="745" y="194" font-size="11" fill="#64748b">signal</text>
    </g>

    <g>
      <circle cx="954" cy="115" r="26" fill="#0f1c2e" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="954" cy="115" r="26" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0">
        <animate attributeName="r" values="26;40" dur="4.2s" begin="3.36s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".7;0" dur="4.2s" begin="3.36s" repeatCount="indefinite"/>
      </circle>
      <text x="954" y="121" font-size="17" fill="#f59e0b">💰</text>
      <text x="954" y="176" font-size="13" fill="#e2e8f0" font-weight="600">Paper Broker</text>
      <text x="954" y="194" font-size="11" fill="#64748b">fills · costs</text>
    </g>

    <g>
      <circle cx="1162" cy="115" r="30" fill="#0f1c2e" stroke="#22c55e" stroke-width="2"/>
      <circle cx="1162" cy="115" r="30" fill="none" stroke="#22c55e" stroke-width="2" opacity="0">
        <animate attributeName="r" values="30;46" dur="4.2s" begin="4.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".8;0" dur="4.2s" begin="4.1s" repeatCount="indefinite"/>
      </circle>
      <text x="1162" y="122" font-size="19" fill="#22c55e">✓</text>
      <text x="1162" y="176" font-size="13" fill="#e2e8f0" font-weight="600">Scored Result</text>
      <text x="1162" y="194" font-size="11" fill="#64748b">reproducible</text>
    </g>
  </g>

  <text x="640" y="42" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif"
        font-size="14" fill="#64748b" letter-spacing="2.5">BARS IN · A NUMBER YOU CAN DEFEND OUT</text>
</svg>
