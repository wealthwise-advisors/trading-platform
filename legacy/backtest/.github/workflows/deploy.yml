name: Copying files to EC2
on:
  push:
    paths:
      - 'py_scripts/**'
jobs:
  copy-scripts-to-EC2:
    name: Copy Files to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository to EC2 instance and Copy Script to python env
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SSH_HOST_NAME }}
          username: ${{ secrets.SSH_USER_NAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Check if Git is installed
            if ! command -v git &> /dev/null; then
              echo "Git not found. Installing Git..."
              sudo apt install -y git
            else
              echo "Git is already installed."
            fi

            # Check if the directory exists and remove it
            if [ -d "/home/ubuntu/code_repo/backtest" ]; then
              echo "Directory exists. Removing it..."
              sudo rm -rf /home/ubuntu/code_repo/backtest
            fi

            # Create directory and clone the repository
            mkdir -p /home/ubuntu/code_repo/backtest
            echo "Cloning repository..."
            git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }} /home/ubuntu/code_repo/backtest

            # Copy py_scripts to the python environment directory
            mkdir -p /home/ubuntu/backtest/py_scripts
            cp -r /home/ubuntu/code_repo/backtest/py_scripts/* /home/ubuntu/backtest/py_scripts

            # Kill existing Streamlit processes on specified ports
            lsof -t -i :8502 | xargs -r kill -9

            # Activate Python environment once
            source /home/ubuntu/py-venv/bin/activate 
            cd /home/ubuntu/backtest/py_scripts
            nohup streamlit run /home/ubuntu/backtest/py_scripts/app.py --server.port 8502 > /dev/null 2> error.log & #--server.fileWatcherType polling 300000
            echo "Streamlit app deployed and running in the background."